<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Turbo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; touch-action:none; overscroll-behavior:none; }
  *, *::before, *::after { touch-action:none; -webkit-tap-highlight-color:transparent; }
  input[type=range] { touch-action:none; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    padding:10px 16px; font-family:Consolas, "Courier New", monospace;
  }
  .menu {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px;
    padding:4px; max-width:94vw; background:#05080d; border:1px solid #1a212c;
    box-shadow:inset 0 0 0 1px #000, 0 0 12px rgba(22,143,224,.06);
  }
  .mb {
    display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px;
    font:10px Consolas, monospace; letter-spacing:.08em; color:#7f8998;
    background:#0a0e15; border:1px solid #232b37; cursor:pointer; user-select:none;
  }
  .mb:hover { color:#f2f3f5; border-color:#5d6879; }
  .mb:active { transform:translateY(1px); }
  .mb .led { width:6px; height:6px; background:#1c232d; flex:none; }
  .mb.on { color:#e3e7ec; }
  .mb.on .led { background:#00f13c; box-shadow:0 0 5px #00f13c; }
  .mb.warn { color:#ffb72b; border-color:#7a5a1c; }
  .mb.ok { color:#00f13c; border-color:#1f6b35; }
  .mb.vol { cursor:default; }
  .mb.vol input { width:72px; height:12px; margin:0; accent-color:#168fe0; cursor:pointer; }
  .mb b { color:#00f13c; font-weight:bold; }
  .sep { display:none; }
  .gearbtn {
    position:fixed; top:10px; right:10px; z-index:21; width:36px; height:36px; display:grid; place-items:center;
    background:#0a0e15; border:1px solid #232b37; color:#7f8998; cursor:pointer; padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .gearbtn:hover, .gearbtn.on { color:#f2f3f5; border-color:#5d6879; }
  .gearbtn.on svg { transform:rotate(45deg); }
  .gearbtn svg { transition:transform .2s steps(2); }
  .menu {
    position:fixed !important; top:52px; right:10px; z-index:20; width:252px; max-width:calc(100vw - 20px);
    display:none !important; justify-content:flex-start !important;
  }
  .menu.open { display:flex !important; }
  .menu .mb { flex:1 1 calc(50% - 4px); height:30px !important; font-size:10px !important; padding:0 10px !important; }
  .menu .mb.vol { flex-basis:100%; }
  .menu .mb.vol input { flex:1; width:auto !important; }
  .mtitle { flex-basis:100%; padding:4px 6px 2px; font:bold 9px Consolas, monospace; letter-spacing:.16em; color:#4c5564; }
  .stage {
    position:relative; width:min(560px, 94vw, calc((100vh - 70px) * 0.947));
    filter: drop-shadow(0 0 2px rgba(140,160,190,.12));
  }
  .stage.noroad { width:min(560px, 94vw, calc((100vh - 70px) * 1.616)); }
  .stage.noroad #road { display:none; }
  .stage canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  #mochi {
    position:absolute; width:17%; cursor:grab; touch-action:none; z-index:2;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
  }
  #mochi.drag { cursor:grabbing; }
  #mochi.hidden, #bubble.hidden { display:none; }
  #bubble {
    position:absolute; z-index:3; transform:translate(-50%,-100%); pointer-events:none;
    padding:3px 6px; background:#fff3f6; color:#2b1b25; border:2px solid #4a2f3d;
    font:bold 10px/1.25 Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", monospace; letter-spacing:.04em; white-space:nowrap;
    opacity:0; transition:opacity .15s;
  }
  #bubble.show { opacity:1; }
  #bubble.bl { transform:translate(-100%,-50%); }
  #bubble.br { transform:translate(0,-50%); }
  #bubble::after { content:""; position:absolute; top:50%; margin-top:-4px; border:4px solid transparent; }
  #bubble.bl::after { right:-10px; border-left-color:#4a2f3d; }
  #bubble.br::after { left:-10px; border-right-color:#4a2f3d; }
  .hint {
    text-align:center; color:#3c4350; font:10px/1.5 Consolas, monospace; letter-spacing:.06em;
    user-select:none;
  }
  .hint.hidden { display:none; }
  .hint b { color:#6b7484; font-weight:normal; }

  /* ---------- help dialog ---------- */
  #fail {
    position:absolute; inset:0; z-index:8; display:none; place-items:center;
    background:#03060b; color:#f2f3f5; border:1px solid #7d8796; cursor:pointer;
    font:bold clamp(34px, 10vw, 60px) Consolas, "Courier New", monospace; letter-spacing:.04em;
    user-select:none; -webkit-user-select:none;
  }
  #fail.show { display:grid; }
  #dialog {
    position:absolute; left:6%; right:6%; bottom:4%; z-index:5; display:none;
    padding:12px 14px 14px; background:#05080d; color:#f2f3f5;
    border:3px solid #f2f3f5; box-shadow:0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.55);
    font:bold 13px/1.6 Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", "Courier New", monospace; letter-spacing:.02em; cursor:pointer;
    user-select:none; -webkit-user-select:none;
  }
  #dialog.show { display:block; }
  #dialog.tip { bottom:auto; top:4%; border-color:#ffb72b; }
  #dialog.tip #dlgTitle { background:#ffb72b; }
  #dlgTitle {
    position:absolute; top:-13px; left:10px; padding:1px 7px; background:#f2f3f5; color:#05080d;
    font:bold 10px Consolas, monospace; letter-spacing:.1em; white-space:pre;
  }
  #dlgText { min-height:2.9em; }
  #dlgText .k {
    display:inline-block; min-width:1.5em; padding:0 4px; margin:0 1px; text-align:center;
    background:#f2f3f5; color:#05080d; box-shadow:0 2px 0 #7d8796; line-height:1.35;
  }
  #dlgMore { position:absolute; right:10px; bottom:4px; font-size:11px; animation:blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ---------- touch pad (handheld style) ---------- */
  .pad {
    position:fixed; left:0; right:0; bottom:0; z-index:10; display:none;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(#dcd9d2,#c5c1b8); border-radius:20px 20px 0 0;
    box-shadow:0 -8px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.65);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    font:bold 9px Consolas, monospace; letter-spacing:.08em; color:#45415a;
  }
  body.has-pad .pad { display:block; }
  .pad [data-k] { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .gears { display:flex; justify-content:center; gap:6px; margin-bottom:12px; }
  .g {
    min-width:34px; height:26px; padding:0 6px; border-radius:7px; display:grid; place-items:center;
    background:#4a4752; color:#e8e6ee; font-size:12px; box-shadow:0 3px 0 #2a2830;
  }
  .g.on { background:#f02b32; color:#fff; box-shadow:0 3px 0 #8a1218; }
  .g.hb { margin-left:6px; font-size:10px; }
  .g.hb.on { background:#ffb72b; color:#2a2016; box-shadow:0 3px 0 #8a5d10; }
  .prow { display:flex; align-items:center; justify-content:space-between; max-width:460px; margin:0 auto; }
  .dpad { position:relative; width:126px; height:126px; flex:none; }
  .dpad .d { position:absolute; width:42px; height:42px; background:#26252b; display:grid; place-items:center; color:#5d5a66; font-size:12px; }
  .dpad .d.u { left:42px; top:0; border-radius:6px 6px 0 0; }
  .dpad .d.dn { left:42px; top:84px; border-radius:0 0 6px 6px; }
  .dpad .d.l { left:0; top:42px; border-radius:6px 0 0 6px; }
  .dpad .d.r { left:84px; top:42px; border-radius:0 6px 6px 0; }
  .dpad .c { position:absolute; left:42px; top:42px; width:42px; height:42px; background:#26252b; }
  .dpad .c::after { content:""; position:absolute; inset:13px; border-radius:50%; background:#1c1b20; }
  .dpad::before { content:""; position:absolute; inset:0; background:
      linear-gradient(#26252b,#26252b) 42px 0/42px 126px no-repeat, linear-gradient(#26252b,#26252b) 0 42px/126px 42px no-repeat;
    filter:drop-shadow(0 4px 0 #15141a); }
  .dpad .lbl { position:absolute; font-size:8px; color:#6a667a; white-space:nowrap; }
  .mid { display:flex; gap:14px; transform:rotate(-25deg); align-self:flex-end; margin-bottom:6px; }
  .pill { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .pill i { display:block; width:42px; height:12px; border-radius:8px; background:#8d8a93; box-shadow:inset 0 -2px 0 #6d6a73, 0 2px 0 #5f5c66; }
  .ab { position:relative; width:132px; height:112px; transform:rotate(-25deg); flex:none; }
  .ab .bt { position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ab .bt i { display:grid; place-items:center; width:54px; height:54px; border-radius:50%; font-style:normal; font-size:15px; color:#f6d6e2;
    background:radial-gradient(circle at 35% 30%,#c23a72,#9b2257 60%); box-shadow:0 4px 0 #5e1233; }
  .ab .bt.a { right:0; top:0; }
  .ab .bt.b { left:0; top:42px; }
  .down i, .d.down, .g.down { transform:translateY(2px); filter:brightness(.85); }
  .down i { box-shadow:0 2px 0 #5e1233; }

  body.has-pad { padding-bottom:calc(228px + env(safe-area-inset-bottom)); }
  body.has-pad .stage { width:min(560px, 94vw, calc((100dvh - 300px) * 0.947)); }
  body.has-pad .stage.noroad { width:min(560px, 94vw, calc((100dvh - 300px) * 1.616)); }
  @media (orientation:landscape) and (max-height:540px) {
    body.has-pad { padding:6px 200px; }
    body.has-pad { gap:6px; justify-content:flex-start; }
    body.has-pad .menu { gap:2px; padding:2px; }
    body.has-pad .mb { height:20px; padding:0 6px; font-size:9px; gap:4px; }
    body.has-pad .mb.vol input { width:48px; }
    body.has-pad .sep { display:none; }
    body.has-pad .stage { width:min(560px, calc(100vw - 410px), calc((100dvh - 24px) * 0.947)); }
    body.has-pad .stage.noroad { width:min(560px, calc(100vw - 410px), calc((100dvh - 24px) * 1.616)); }
    .pad { inset:0; padding:0; background:none; box-shadow:none; border-radius:0; pointer-events:none; color:#8b929d; }
    .pad .prow { display:contents; }
    .gears { position:fixed; left:14px; top:14px; width:176px; flex-wrap:wrap; justify-content:flex-start; pointer-events:auto; }
    .g.hb { margin-left:0; }
    .dpad { position:fixed; left:30px; bottom:22px; pointer-events:auto; }
    .mid { position:fixed; right:34px; top:64px; transform:none; pointer-events:auto; }
    .ab { position:fixed; right:22px; bottom:26px; pointer-events:auto; }
  }
</style>
</head>
<body>
<button id="btnSettings" class="gearbtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor"><path d="M7 0h2v2h2v1h1v-1h2v2h-1v1h1v2h2v2h-2v2h-1v1h1v2h-2v-1h-1v1h-2v2h-2v-2h-2v-1h-1v1h-2v-2h1v-1h-1v-2h-2v-2h2v-2h1v-1h-1v-2h2v1h1v-1h2zM6 5v1h-1v4h1v1h4v-1h1v-4h-1v-1z"/></svg></button>
<nav class="menu" id="menu" aria-label="Settings">
  <div class="mtitle">SETTINGS</div>
  <button id="btnSound" class="mb" type="button"><i class="led"></i>SOUND</button>
  <label class="mb vol">VOL <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"></label>
  <span class="sep"></span>
  <button id="btnFuel" class="mb" type="button">REFUEL</button>

  <canvas id="road" width="320" height="140" aria-label="Road view"></canvas>

  <div id="dialog" role="dialog" aria-live="polite"><div id="dlgTitle"></div><div id="dlgText"></div><div id="dlgMore"></div></div>
</div>
<div class="hint" id="hint"><b>I</b> START/STOP &nbsp; <b>↑</b> THROTTLE (+SHIFT = PART) &nbsp; <b>↓</b> BRAKE &nbsp; <b>SPACE</b> HANDBRAKE<br><b>P R N D S L</b> GEAR &nbsp; <b>+ / −</b> MANUAL STEP &nbsp; <b>← →</b> SIGNAL / LANE CHANGE &nbsp; <b>ESC</b> PAUSE</div>

  <div class="gears">
    <div class="g" data-k="g:P">P</div><div class="g" data-k="g:R">R</div><div class="g" data-k="g:N">N</div>
    <div class="g" data-k="g:D">D</div><div class="g" data-k="g:S">S</div><div class="g" data-k="g:L">L</div>

  </div>
  <div class="prow">
    <div class="dpad">
      <div class="d u" data-k="up">▲</div><div class="d l" data-k="left">◀</div><div class="c"></div>
      <div class="d r" data-k="right">▶</div><div class="d dn" data-k="down">▼</div>

    </div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("cluster");
  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const C = {
    bg:"#03060b", white:"#f2f3f5", muted:"#8b929d", dim:"#343b46", off:"#222933",
    red:"#f02b32", green:"#00f13c", blue:"#168fe0", amber:"#ffb72b"
  };
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;

  /* =====================================================================
     ENGINE SOUND SYNTH  (runs inside an AudioWorklet, or ScriptProcessor fallback)
     4-cylinder 4-stroke firing pulses (order 1-3-4-2) -> header + tailpipe
     waveguide resonances -> muffler. Plus intake, turbo whistle, blow-off
     valve, starter motor, CVT belt whine, road/wind, lever + drivetrain clunks.
     ===================================================================== */
  /*SYNTH-BEGIN*/
  const SYNTH_SRC = `
class SVF {
  constructor(){ this.ic1=0; this.ic2=0; this.a1=0; this.a2=0; this.a3=0; this.k=1; this.lp=0; this.hp=0; }
  set(fc,q,sr){ fc=Math.max(20,Math.min(fc,sr*0.45)); const g=Math.tan(Math.PI*fc/sr); this.k=1/q; this.a1=1/(1+g*(g+this.k)); this.a2=g*this.a1; this.a3=g*this.a2; }
  run(x){ const v3=x-this.ic2; const v1=this.a1*this.ic1+this.a2*v3; const v2=this.ic2+this.a2*this.ic1+this.a3*v3;
    this.ic1=2*v1-this.ic1; this.ic2=2*v2-this.ic2; this.lp=v2; this.hp=x-this.k*v1-v2; return v1; }
}
class EngineSynth {
  constructor(sr){
    this.sr=sr;
    this.t={rpm:0,load:0,thr:0,turbo:0,boost:0,starter:0,speed:0,cut:1,running:0,pop:0,vol:0};
    this.rpm=0;this.load=0;this.thr=0;this.turbo=0;this.boost=0;this.starter=0;this.speed=0;this.vol=0;
    this.crank=0;this.lastFire=-1;
    this.pa=new Float32Array(8);this.pt=new Float32Array(8).fill(1);this.ptau=new Float32Array(8).fill(0.001);this.pi=0;
    this.cyl=[1.0,0.9,1.07,0.95];
    this.d1=new Float32Array(8192);this.d2=new Float32Array(8192);this.di=0;
    this.l1=Math.round(sr*0.0052);this.l2=Math.round(sr*0.0021);
    this.f1=0;this.f2=0;this.m1=0;this.m2=0;this.dcx=0;this.dcy=0;this.mc=0.05;this.rasp=0.05;
    this.intake=new SVF();this.whoosh=new SVF();this.bovF=new SVF();this.bovF2=new SVF();
    this.wind=new SVF();this.popF=new SVF();this.starterF=new SVF();this.clickF=new SVF();
    this.road=0;this.road2=0;this.env=0;
    this.tPh=0;this.sPh=0;this.wPh=0;this.thPh=0;this.tf=1000;this.wf=600;
    this.bov=0;this.bovAmt=0;this.bovAge=1;
    this.thump=0;this.thumpAmt=0;this.click=0;this.click2=-1;this.popEnv=0;
    this.seed=22222;this.ctr=0;
    const e=(tc)=>Math.exp(-1/(sr*tc));
    this.thDecay=e(0.075);this.clDecay=e(0.0035);this.popDecay=e(0.022);
    this.clickF.set(3200,0.9,sr);this.bovF2.set(650,1.3,sr);this.wind.set(1000,0.5,sr);
    this.popF.set(1400,0.8,sr);this.starterF.set(1100,2.0,sr);
    this.updateFilters();
  }
  rnd(){ this.seed=(this.seed*1664525+1013904223)>>>0; return this.seed/4294967296; }
  event(e){
    if(e.type==='bov'){ this.bov=1; this.bovAmt=e.amt; this.bovAge=0; }
    else if(e.type==='lever'){ this.click=1; this.click2=Math.round(this.sr*0.05); }
    else if(e.type==='tick'){ this.click=e.amt; this.click2=-1; }
    else if(e.type==='thump'){ this.thump=1; this.thumpAmt=e.amt; this.thPh=0; }
  }
  fire(i){
    const t=this.t; let a;
    if(t.running>0.5 && t.cut<0.5){ a=0.36+0.64*this.load; }
    else if(this.starter>0.05){ a=0.14; }
    else {
      a=0.05;
      if(t.running>0.5 && t.pop>0.05 && this.rpm>2300 && this.rnd()<0.06*t.pop){ a=1.6; this.popEnv=1; }
    }
    a*=this.cyl[i]*(1+(this.rnd()-0.5)*0.16);
    const j=this.pi; this.pi=(this.pi+1)&7;
    this.pa[j]=a; this.pt[j]=0; this.ptau[j]=0.0007+0.0011*Math.max(0,1-this.rpm/7000);
  }
  updateFilters(){
    const sr=this.sr, rpm=this.rpm;
    const fc=260+this.load*1500+rpm*0.11;
    this.mc=1-Math.exp(-2*Math.PI*fc/sr);
    this.rasp=0.04+0.16*this.load;
    this.intake.set(360+rpm*0.12,1.4,sr);
    this.tf=900+this.turbo*7200;
    this.whoosh.set(600+this.turbo*3600,2.4,sr);
    this.bovF.set(1200+2600*Math.min(1,this.bov*1.4),0.75,sr);
    this.wf=520+this.speed*19;
  }
  render(out,n){
    const sr=this.sr,t=this.t,dt=1/sr;
    const kr=1-Math.exp(-dt/0.014), ks=1-Math.exp(-dt/0.045);
    for(let s=0;s<n;s++){
      if((this.ctr++&31)===0) this.updateFilters();
      this.rpm+=(t.rpm-this.rpm)*kr; this.load+=(t.load-this.load)*kr; this.thr+=(t.thr-this.thr)*ks;
      this.turbo+=(t.turbo-this.turbo)*ks; this.boost+=(t.boost-this.boost)*ks;
      this.starter+=(t.starter-this.starter)*ks; this.speed+=(t.speed-this.speed)*ks; this.vol+=(t.vol-this.vol)*ks;

      // crankshaft: two firings per revolution, cycle = 2 revolutions
      this.crank+=this.rpm/60*dt; if(this.crank>=2) this.crank-=2;
      const fi=(this.crank*2)|0;
      if(fi!==this.lastFire){ this.lastFire=fi; if(this.rpm>40) this.fire(fi); }

      // exhaust pressure pulses (blow-down + rarefaction tail)
      let px=0;
      for(let j=0;j<8;j++){
        const age=this.pt[j];
        if(age<0.03){
          const x=age/this.ptau[j];
          px+=this.pa[j]*(x*Math.exp(1-x)-0.3*(x/3)*Math.exp(1-x/3));

    try{ if(ac.state!=="running") ac.resume(); }catch(e){}
    // iOS: playing a silent buffer inside the gesture unlocks output
    try{ const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){}
    audio.on=true;
    setSoundUI(true);
  }
  function stopAudio(){
    audio.on=false; audio.send({vol:0});
    setSoundUI(false);
    setTimeout(()=>{ if(!audio.on && audio.ctx) audio.ctx.suspend(); },250);
  }
  soundButton.addEventListener("click",()=>{
    if(!audio.userOff){ audio.userOff=true; stopAudio(); } else { audio.userOff=false; startAudio(); }
  });
  // Sound is on by default. Browsers only let it start inside a user gesture, so every
  // gesture event (captured before anything else can stop it) retries until it is running.
  setSoundUI(true);
  const unlockAudio=e=>{
    if(audio.userOff) return;
    if(e.target && e.target.closest && e.target.closest("#btnSound")) return;
    if(!audio.ctx || audio.ctx.state!=="running") startAudio();
  };
  for(const ev of ["pointerdown","pointerup","touchend","mousedown","keydown","click"])
    window.addEventListener(ev,unlockAudio,{capture:true,passive:true});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && audio.on && audio.ctx && audio.ctx.state!=="running") try{ audio.ctx.resume(); }catch(e){} });
  // No pinch / double-tap zoom on phones (iOS ignores user-scalable=no).
  document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
  document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
  document.addEventListener("touchstart",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
  document.addEventListener("touchmove",e=>{ if(e.touches.length>1 || e.scale&&e.scale!==1) e.preventDefault(); },{passive:false});
  document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
  let lastTouchEnd=0;
  document.addEventListener("touchend",e=>{ const n=Date.now(); if(n-lastTouchEnd<350 && !(e.target.closest && e.target.closest("input"))) e.preventDefault(); lastTouchEnd=n; },{passive:false});

  /* ============================== SIM ============================== */
  let onSimEvent=()=>{};
  const sim=createSim({ event:ev=>{ audio.event(ev); onSimEvent(ev); } });
  const S=sim.S;
  const ui={ left:false, right:false, blink:true, blinkClock:0, paused:false, last:performance.now(),
             dispSpeed:0, dispRpm:0, rpmNum:0, rpmNumT:0 };

/* ============================== ROAD VIEW ==============================
     Low-res pseudo-3D road: per-scanline projection (z = camH*f/dy), curving
     road, rumble strips, lane dashes, reflector posts, trees, street lamps,
     parallax mountains. Headlights light the near road when ignition is on.
     ===================================================================== */
  const roadCanvas=$("road");
  const rc=roadCanvas.getContext("2d",{alpha:false});
  rc.imageSmoothingEnabled=false;
  const RW=320, RH=140, HZ=50, CAM_H=1.25;
  const road={ pos:0, k:0, kT:0, nextK:250, heading:0, camX:-1.8, latV:0, lane:0, laneT:0, bump:0, bumpKick:false };
  const hash=n=>{ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };
  const STARS=[]; for(let i=0;i<80;i++) STARS.push([hash(i)*640|0, hash(i+99)*(HZ-8)|0, hash(i+7)]);
  const MTN=new Float32Array(640), HILL=new Float32Array(640);
  for(let i=0;i<640;i++){
    const a=i/640*Math.PI*2;
    MTN[i]=11+6*Math.sin(a*3+1)+4*Math.sin(a*7+2)+2.5*Math.sin(a*13)+1.2*Math.sin(a*31);
    HILL[i]=4+3*Math.sin(a*5+4)+2*Math.sin(a*11+1)+1*Math.sin(a*23);
  }
  const skyGrad=rc.createLinearGradient(0,0,0,HZ+2);
  skyGrad.addColorStop(0,"#05081a"); skyGrad.addColorStop(0.55,"#1a1536"); skyGrad.addColorStop(1,"#5c3459");
  const FOG=[64,38,76];
  function col(c,l,fog){
    const r=c[0]*l, g=c[1]*l, b=c[2]*l;
    return "rgb("+((r+(FOG[0]-r)*fog)|0)+","+((g+(FOG[1]-g)*fog)|0)+","+((b+(FOG[2]-b)*fog)|0)+")";
  }
  const lightAt=z=>Math.min(1,0.4+(S.ignition?0.75*clamp(1-(z-3)/42,0,1):0));
  const fogAt=z=>clamp((z-30)/160,0,0.85);
  function blob(x,y,r){ const R=Math.max(1,Math.round(r)); for(let i=-R;i<=R;i++){ const w=Math.sqrt(R*R-i*i); rc.fillRect(Math.round(x-w),Math.round(y+i),Math.max(1,Math.round(2*w)),1); } }

  function updateRoad(dt){
    const v=S.v, kmh=v*3.6;
    road.pos+=v*dt;
    if(road.pos>road.nextK || road.pos<road.nextK-900){
      road.kT=Math.random()<0.35?0:(Math.random()*2-1)*0.0035;
      road.nextK=road.pos+220+Math.random()*380;
    }
    road.k+=(road.kT-road.k)*clamp(Math.abs(v)*dt/120,0,1);
    road.heading+=road.k*v*dt;
    // lane change with the signal (left-hand traffic: home lane is the left one)
    let want=-1;
    if(kmh>8){
      want=ui.right&&road.lane===0?1:ui.left&&road.lane===1?0:-1;
      if(want>=0){ road.laneT+=dt; if(road.laneT>0.6){ road.lane=want; road.laneT=0; road.changing=true; } } else road.laneT=0;
    }
    const tx=road.lane?1.8:-1.8;
    // smooth lateral motion like a real lane change: about 2.5 s, max ~0.2 g sideways, slower at low speed
    const sp=clamp(Math.abs(kmh)/30,0,1), w0=2.2*sp;
    const latA=clamp((tx-road.camX)*w0*w0-(2*w0+(sp<0.05?0.6:0))*road.latV,-2.2,2.2);
    road.latV+=latA*dt; road.camX+=road.latV*dt;
    if(road.changing && Math.abs(tx-road.camX)<0.05){
      road.changing=false;                       // lane change done: self-cancel the indicator
      if(road.lane===1) ui.right=false; else ui.left=false;
    }
    if(Math.abs(kmh)>10 && Math.random()<dt*Math.abs(kmh)/180){ road.bump=1; road.bumpKick=true; }
    road.bump*=Math.exp(-dt*16);
    updateTraffic(dt);
  }

  function drawRoad(now){
    if(!ui.road) return;
    const kmh=Math.abs(S.v*3.6);
    const f=150-Math.min(200,kmh)*0.16;            // field of view widens with speed
    let shake=0;
    if(S.engine==="cranking"||S.limiter) shake=((now/45)|0)%2;
    else if(road.bump>0.35) shake=1;
    const hz=HZ+shake;
    rc.fillStyle=skyGrad; rc.fillRect(0,0,RW,hz+1);
    // stars + moon
    const sOff=road.heading*120;
    for(const s of STARS){
      const x=(((s[0]-sOff)%640)+640)%640;
      if(x<RW){ const tw=0.45+0.55*Math.abs(Math.sin(now/700+s[2]*20)); rc.fillStyle="rgba(230,230,255,"+(tw*s[2]).toFixed(2)+")"; rc.fillRect(x|0,s[1],1,1); }
    }
    const mx=(((262-road.heading*140)%640)+640)%640;
    if(mx<RW+8){ rc.fillStyle="#efe6c8"; blob(mx,15,5); rc.fillStyle="#d4c9a8"; rc.fillRect((mx-2)|0,13,2,2); rc.fillRect((mx+1)|0,17,1,1); }
    // parallax mountains + hills
    const o1=road.heading*55, o2=road.heading*150;
    rc.fillStyle="#1f1838";
    for(let x=0;x<RW;x++){ const h=MTN[(((x+o1)|0)%640+640)%640]; rc.fillRect(x,hz-h,1,h+1); }
    rc.fillStyle="#120e22";
    for(let x=0;x<RW;x++){ const h=HILL[(((x+o2)|0)%640+640)%640]; rc.fillRect(x,hz-h,1,h+1); }
    // ground scanlines
    const camX=road.camX, kf=0.5*road.k*f;
    for(let y=hz+1;y<RH;y++){
      const dy=y-hz, z=CAM_H*f/dy, sx=f/z;
      const cx=160+kf*z-camX*sx;
      const hw=3.6*sx, rum=Math.max(1,0.45*sx), ln=Math.max(1,0.13*sx);
      const wz=z+road.pos, alt=Math.floor(wz/4)&1;
      const l=lightAt(z), fg=fogAt(z);
      rc.fillStyle=col(alt?[26,62,36]:[21,52,31],l,fg); rc.fillRect(0,y,RW,1);
      rc.fillStyle=col(alt?[190,40,44]:[215,215,215],l,fg);
      rc.fillRect(cx-hw-rum,y,rum,1); rc.fillRect(cx+hw,y,rum,1);
      rc.fillStyle=col(alt?[48,51,58]:[43,46,52],l,fg); rc.fillRect(cx-hw,y,hw*2,1);
      rc.fillStyle=col([225,225,215],l,fg);
      rc.fillRect(cx-hw+0.15*sx,y,ln,1); rc.fillRect(cx+hw-0.15*sx-ln,y,ln,1);
      if(((wz%12)+12)%12<5) rc.fillRect(cx-ln/2,y,ln,1);
    }
    // roadside objects, far to near
    const objs=[], SP=15;
    for(let n=Math.floor((road.pos+1.5)/SP);n<=Math.floor((road.pos+190)/SP);n++){
      const z=n*SP-road.pos; if(z<1.5) continue;
      const r=hash(n);
      objs.push({z,x:-4.7,t:"post",side:-1},{z,x:4.7,t:"post",side:1});
      if(n%3===0) objs.push({z,x:(r<0.5?-1:1)*(8+r*7),t:r<0.22||r>0.82?"pine":"tree",r});
      if(n%3===1&&r>0.55) objs.push({z,x:(r<0.78?-1:1)*(11+r*9),t:"pine",r});
      if(n%5===0) objs.push({z,x:-6.3,t:"lamp"});
      if(n%23===7) objs.push({z,x:5.8,t:"sign"});
    }
    for(const c of road.cars){ const z=c.pos-road.pos; if(z>1&&z<240) objs.push({z,x:c.x,t:"car",c}); }
    objs.sort((a,b)=>b.z-a.z);
    for(const o of objs){
      const sx=f/o.z, gy=hz+CAM_H*sx, x=160+kf*o.z+(o.x-camX)*sx;
      if(x<-60||x>RW+60) continue;
      const l=lightAt(o.z), fg=fogAt(o.z);
      if(o.t==="car"){ drawCar(o.c,sx,gy,x,l,fg); continue; }
      if(o.t==="post"){
        const w=Math.max(1,0.12*sx), h=Math.max(2,1.0*sx);
        rc.fillStyle=col([210,210,205],l,fg); rc.fillRect(x-w/2,gy-h,w,h);
        rc.fillStyle=col(o.side<0?[255,140,30]:[235,60,60],Math.max(l,0.8),fg); rc.fillRect(x-w/2,gy-h,w,Math.max(1,0.15*sx));
      } else if(o.t==="tree"){
        rc.fillStyle=col([70,48,32],l,fg); rc.fillRect(x-0.18*sx,gy-1.6*sx,Math.max(1,0.36*sx),1.6*sx);
        rc.fillStyle=col(o.r>0.5?[30,82,44]:[38,92,40],l,fg); blob(x,gy-3.0*sx,1.7*sx);
        rc.fillStyle=col([48,110,54],l,fg); blob(x-0.5*sx,gy-3.4*sx,0.8*sx);
      } else if(o.t==="pine"){
        const h=(5+o.r*3)*sx, hw=1.5*sx;
        rc.fillStyle=col([60,42,30],l,fg); rc.fillRect(x-0.12*sx,gy-0.9*sx,Math.max(1,0.24*sx),0.9*sx);
        rc.fillStyle=col([20,66,42],l,fg);
        for(let i=0;i<h;i++){ const w=Math.max(1,hw*(i/h)*(1-0.25*((i/h*4)%1))); rc.fillRect(x-w,gy-0.8*sx-h+i,w*2,1); }
      } else if(o.t==="lamp"){
        const h=7*sx, w=Math.max(1,0.14*sx);
        rc.fillStyle=col([120,125,135],l,fg); rc.fillRect(x-w/2,gy-h,w,h); rc.fillRect(x,gy-h,1.6*sx,Math.max(1,0.12*sx));
        rc.fillStyle="rgba(255,214,130,"+(0.12*(1-fg)).toFixed(3)+")"; blob(x+1.5*sx,gy-h+0.6*sx,1.4*sx);
        rc.fillStyle=col([255,228,160],1,fg*0.6); rc.fillRect(x+1.1*sx,gy-h+0.1*sx,Math.max(1,0.6*sx),Math.max(1,0.18*sx));
      } else if(o.t==="sign"){
        const h=2.3*sx, w=Math.max(1,0.08*sx), r=Math.max(1,0.45*sx);
        rc.fillStyle=col([150,150,155],l,fg); rc.fillRect(x-w/2,gy-h,w,h);
        rc.fillStyle=col([220,40,40],Math.max(l,0.7),fg); blob(x,gy-h-r*0.6,r);
        rc.fillStyle=col([235,235,235],Math.max(l,0.7),fg); blob(x,gy-h-r*0.6,r*0.65);
        if(r>=4){ rc.fillStyle="#222"; rc.fillRect(x-r*0.4,gy-h-r*0.85,r*0.25,r*0.5); rc.fillRect(x+r*0.12,gy-h-r*0.85,r*0.25,r*0.5); }
      }
    }
    // hood + frame
    rc.fillStyle="#06080c";
    for(let i=0;i<12;i++){ const w=72+i*i*1.3; rc.fillRect(160-w,RH-12+i,w*2,1); }
    rc.fillStyle=S.ignition?"#26303f":"#161b24"; rc.fillRect(88,RH-12,144,1);
    rc.strokeStyle="#7d8796"; rc.lineWidth=1; rc.strokeRect(1.5,1.5,RW-3,RH-1);
    rc.strokeStyle="#202936"; rc.strokeRect(4.5,4.5,RW-9,RH-7);
    if(ui.paused){ rc.fillStyle="rgba(0,0,0,.45)"; rc.fillRect(0,0,RW,RH); }
  }

  /* ============================== TRAFFIC GAME ==============================
     Cars ahead in both lanes, drawn as dark silhouettes with tail lights you
     can spot from far away. Change lane with ← → to get past. Hit one and the
     run ends on a clean screen showing only the distance driven.
     ===================================================================== */
  road.cars=[]; road.spawnT=3; ui.runKm=0; ui.failed=false; ui.failT=0;
  ui.traffic=(()=>{ try{ return localStorage.getItem("mdc-traffic")!=="off"; }catch(e){ return true; } })();
  const CAR_TYPES=["sedan","sedan","hatch","hatch","suv","suv","van"];
  // tail-light layouts in metres for a 1.8 m wide car: [x, y-from-light-line, w, h]
  const LIGHTS=[
    [[-0.86,0,0.3,0.13],[0.56,0,0.3,0.13]],                                            // twin blocks
    [[-0.86,0.02,1.72,0.06],[-0.86,-0.02,0.24,0.14],[0.62,-0.02,0.24,0.14]],          // full-width bar
    [[-0.88,-0.08,0.07,0.3],[-0.88,-0.08,0.3,0.07],[0.81,-0.08,0.07,0.3],[0.58,-0.08,0.3,0.07]], // L shapes
    [[-0.86,0.02,0.09,0.09],[-0.73,0.02,0.09,0.09],[-0.6,0.02,0.09,0.09],[0.51,0.02,0.09,0.09],[0.64,0.02,0.09,0.09],[0.77,0.02,0.09,0.09]], // triple dots
    [[-0.88,-0.42,0.08,0.58],[0.8,-0.42,0.08,0.58]],                                   // tall pillar strips
    [[-0.86,0,0.14,0.14],[-0.67,0,0.14,0.14],[0.53,0,0.14,0.14],[0.72,0,0.14,0.14]]   // round quads
  ];
  const BODY={ // [width, wheel h, body h, cabin h, cabin width ratio, light line from body top]
    sedan:[1.8,0.28,0.62,0.5,0.76,0.14], hatch:[1.75,0.28,0.66,0.58,0.84,0.12],
    suv:[1.9,0.34,0.8,0.62,0.88,0.16], van:[2.0,0.32,1.95,0,1,1.45]
  };
  function spawnCar(){
    const lane=Math.random()<0.6?0:1, pos=road.pos+200+Math.random()*70;
    for(const c of road.cars){
      const gap=Math.abs(c.pos-pos);
      if(c.lane===lane&&gap<28) return;
      if(c.lane!==lane&&gap<18) return;      // always leave a way through
    }
    const cruise=(lane===0?44+Math.random()*30:68+Math.random()*30)/3.6;
    const type=CAR_TYPES[(Math.random()*CAR_TYPES.length)|0];
    road.cars.push({ pos, lane, x:lane?1.8:-1.8, v:cruise, cruise, type,
      style:type==="van"?0:(Math.random()*LIGHTS.length)|0, brakeT:0, braking:false });
  }
  function updateTraffic(dt){
    if(ui.failed) return;
    if(!ui.traffic){ road.cars.length=0; return; }
    if(S.ignition) ui.runKm+=Math.abs(S.v)*dt/1000;
    const cars=road.cars;
    for(const c of cars){
      let target=c.cruise;
      c.brakeT-=dt; if(c.brakeT>0) target=c.cruise*0.55;
      else if(Math.random()<dt*0.006) c.brakeT=0.8+Math.random()*1.4;
      let lead=null;
      for(const o of cars) if(o!==c&&o.lane===c.lane&&o.pos>c.pos&&(!lead||o.pos<lead.pos)) lead=o;
      if(lead&&lead.pos-c.pos<35) target=Math.min(target,lead.v*(lead.pos-c.pos<16?0.8:1));
      c.braking=target<c.v-0.4;
      c.v+=clamp(target-c.v,-7*dt,2.2*dt);
      c.pos+=c.v*dt;
    }
    road.cars=cars.filter(c=>c.pos-road.pos<360&&c.pos-road.pos>-40);
    const kmh=S.v*3.6, want=ui.runKm<0.5?1:Math.min(3,1+Math.floor(ui.runKm/2));
    road.spawnT-=dt;
    if(kmh>15&&road.cars.length<want&&road.spawnT<=0){ spawnCar(); road.spawnT=6+Math.random()*10; }
    // collision: our front bumper is ~2.2 m ahead of the camera
    for(const c of road.cars){
      const dz=c.pos-road.pos;
      if(dz<2.3&&dz>-1.2&&Math.abs(c.x-road.camX)<1.7&&S.v>c.v-0.5&&S.v>1){ crash(); break; }
    }
  }
  const failEl=$("fail");
  function crash(){
    ui.failed=true; ui.failT=0;
    failEl.textContent=ui.runKm.toFixed(1)+" km";
    failEl.classList.add("show");
    audio.event({type:"thump",amt:2.2});
    if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive)) navigator.vibrate([60,40,120]);
  }
  function restartRun(){
    ui.failed=false; failEl.classList.remove("show");
    road.cars=[]; road.spawnT=3; ui.runKm=0;
    S.v=0; S.lock=false; S.pedal=0; S.brake=0;
    if(S.engine==="running"){ S.w=S.P.idle*Math.PI/30; S.rpm=S.P.idle; }
    road.camX=road.lane?1.8:-1.8; road.latV=0; road.changing=false;
    keys.clear();
  }
  failEl.addEventListener("pointerdown",e=>{ e.preventDefault(); if(ui.failT>0.8) restartRun(); });
  window.addEventListener("keydown",e=>{
    if(!ui.failed) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if(!e.repeat&&ui.failT>0.8) restartRun();
  },{capture:true});
  window.addEventListener("keyup",e=>{ if(ui.failed){ e.stopImmediatePropagation(); } },{capture:true});

  function drawCar(c,sx,gy,x,l,fg){
    const B=BODY[c.type], k=B[0]/1.8, R=(a,b,w,h)=>rc.fillRect(Math.round(a),Math.round(b),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
    const hw=B[0]/2*sx, wheelTop=gy-B[1]*sx, bodyTop=wheelTop-B[2]*sx;
    const lit=Math.min(1,l*0.6);
    // ground shadow + wheels
    rc.fillStyle="rgba(0,0,0,"+(0.45*(1-fg)).toFixed(2)+")"; R(x-hw*1.08,gy-0.1*sx,hw*2.16,0.16*sx);
    rc.fillStyle=col([6,6,8],1,fg*0.8);
    R(x-hw+0.05*sx,wheelTop,0.34*sx,B[1]*sx); R(x+hw-0.39*sx,wheelTop,0.34*sx,B[1]*sx);
    // body + cabin silhouette, faint rim from our headlights
    rc.fillStyle=col([30,32,40],0.4+lit,fg*0.85); R(x-hw,bodyTop,hw*2,B[2]*sx);
    if(B[3]>0){
      const ch=B[3]*sx, cw=hw*B[4];
      for(let i=0;i<ch;i++){ const w=cw*(0.8+0.2*(i/ch)); R(x-w,bodyTop-ch+i,w*2,1); }
      rc.fillStyle=col([44,52,70],0.4+lit,fg*0.85);
      const wh=ch*0.62; for(let i=0;i<wh;i++){ const w=cw*(0.7+0.2*(i/wh)); R(x-w,bodyTop-ch+ch*0.2+i,w*2,1); }
    }
    if(sx>6){ rc.fillStyle=col([200,200,190],0.25+lit*0.5,fg); R(x-0.22*sx,wheelTop-0.2*sx,0.44*sx,0.12*sx); } // plate
    // tail lights (barely fogged so they read from far away)
    const ly=bodyTop+B[5]*sx, on=c.braking, lf=fg*0.3;
    const glowPad=Math.max(1,0.12*sx);
    for(const L of LIGHTS[c.style]){
      const lx=x+L[0]*k*sx, lyy=ly+L[1]*sx, lw=L[2]*k*sx, lh=L[3]*sx;
      rc.fillStyle="rgba(255,40,30,"+((on?0.38:0.18)*(1-lf)).toFixed(2)+")";
      R(lx-glowPad,lyy-glowPad,lw+glowPad*2,lh+glowPad*2);
    }
    rc.fillStyle=col(on?[255,92,74]:[205,24,24],1,lf);
    for(const L of LIGHTS[c.style]) R(x+L[0]*k*sx,ly+L[1]*sx,L[2]*k*sx,L[3]*sx);
    if(on&&B[3]>0){ rc.fillStyle=col([255,92,74],1,lf); R(x-0.25*sx,bodyTop-B[3]*sx-0.02*sx,0.5*sx,0.05*sx); } // third brake light
  }

  /* ============================== MOCHI ==============================
     Floating low-res mochi blob. Mood is picked from the car state
     (gear, rpm, speed, boost, braking, events) with random variations,
     jelly squash from acceleration, lean in curves, blinking, speech.
     ===================================================================== */
  const stage=$("stage");
  const mochiCanvas=$("mochi"), bubble=$("bubble");

  };
  const SPECIAL=new Set(["crank","held","poke","yum","bov","shift","clunk","limiter","turbo","fast","brake","hungry"]);
  const mo={ x:0.83, y:0.03, t:0, mood:"", eyes:"dot", mouth:"cat", fx:"", blink:0, blinkT:2, lx:0, ly:0, lookT:2,
    sq:0, sqV:0, lean:0, acc:0, lastV:0, evMood:null, evT:0, chatT:8, bubbleT:0, sayCool:0, floatY:0, held:false, shake:false };
  function say(txt){
    if(!ui.mochi) return;
    bubble.textContent=txt; bubble.classList.add("show"); mo.bubbleT=1.7; mo.sayCool=2.2;
  }
  onSimEvent=ev=>{
    if(ev.type==="bov"){ mo.evMood="bov"; mo.evT=1.3; }
    else if(ev.type==="thump"){ mo.evMood=ev.amt<0.3?"shift":"clunk"; mo.evT=ev.amt<0.3?0.7:0.9; mo.sqV+=ev.amt*3; }
    else if(ev.type==="lever"){ if(mo.sayCool<1.6) say("→ "+S.gear); }
    else if(ev.type==="refuel"){ mo.evMood="yum"; mo.evT=1.4; mo.mood=""; }
  };
  function pickMood(){
    const kmh=Math.abs(S.v*3.6), run=S.engine==="running";
    if(mo.held) return "held";
    if(!S.ignition) return mo.evT>0&&mo.evMood==="poke"?"poke":"sleep";
    if(S.engine==="cranking") return "crank";
    if(mo.evT>0&&mo.evMood) return mo.evMood;
    if(S.limiter) return "limiter";
    if(S.map>1.35&&S.pedal>0.6) return "turbo";
    if(kmh>140) return "fast";
    if(S.brake>0.7&&kmh>25) return "brake";
    if(!run) return "off";
    if(S.fuel<8) return "hungry";
    if(S.gear==="R") return "reverse";
    if(S.rpm>4500) return "vroom";
    if(S.pedal>0.3) return "accel";
    if(kmh>15) return "cruise";
    if(S.coolant<35) return "cold";
    if(S.gear==="P") return "park";
    return "idle";
  }
  function updateMochi(dt){
    if(dt<=0) return;
    mo.t+=dt; mo.evT-=dt; mo.sayCool-=dt;
    const m=pickMood();
    if(m!==mo.mood){
      mo.mood=m; const d=MOODS[m];
      mo.eyes=pick(d.eyes); mo.mouth=pick(d.mouth); mo.fx=d.fx||"";
      if(SPECIAL.has(m)||mo.sayCool<=0) say(pick(sayList(d)));
      mo.chatT=7+Math.random()*8;
    }
    mo.chatT-=dt;
    if(mo.chatT<=0){
      const d=MOODS[mo.mood]; mo.chatT=7+Math.random()*9;
      mo.eyes=pick(d.eyes); mo.mouth=pick(d.mouth);
      if(Math.random()<0.65) say(pick(sayList(d)));
    }
    if(mo.bubbleT>0){ mo.bubbleT-=dt; if(mo.bubbleT<=0) bubble.classList.remove("show"); }
    mo.blinkT-=dt; if(mo.blinkT<=0){ mo.blink=0.13; mo.blinkT=1.6+Math.random()*3.6; } mo.blink-=dt;
    // gaze: follow the indicators, otherwise glance around
    mo.lookT-=dt;
    if(ui.left) mo.lx=-1; else if(ui.right) mo.lx=1;
    else if(mo.lookT<=0){ mo.lookT=1.2+Math.random()*3; mo.lx=pick([-1,0,0,1]); mo.ly=S.gear==="R"?1:pick([0,0,-1]); }
    // jelly squash from longitudinal g, lean from lateral g
    if(!ui.paused){ mo.acc+=((S.v-mo.lastV)/dt-mo.acc)*Math.min(1,dt*8); }
    mo.lastV=S.v;
    let target=clamp(-mo.acc*0.035,-0.2,0.3);
    if(mo.mood==="sleep") target=0.05+Math.sin(mo.t*1.6)*0.05;
    if(mo.held) target=-0.18;
    if(road.bumpKick){ road.bumpKick=false; mo.sqV+=0.9+Math.random(); }
    mo.sqV+=((target-mo.sq)*110-mo.sqV*7)*dt; mo.sq=clamp(mo.sq+mo.sqV*dt,-0.35,0.45);
    const lat=road.k*S.v*S.v+(road.changing?(road.lane?0.8:-0.8):0);
    mo.lean+=(clamp(-lat*0.18,-1,1)-mo.lean)*Math.min(1,dt*4);
    mo.floatY=mo.held?0:Math.round(Math.sin(mo.t*(mo.mood==="sleep"?1.1:2.3))*1.4);
    mo.shake=mo.fx.includes("shake")||mo.fx.includes("shiver")||(S.engine==="running"&&S.rpm>5800);
  }
  function placeMochi(){
    const r=stage.getBoundingClientRect(), mw=mochiCanvas.offsetWidth||r.width*0.17, mh=mw*MH/MW;
    mochiCanvas.style.left=(mo.x*r.width-mw/2)+"px";
    mochiCanvas.style.top=(mo.y*r.height)+"px";
    const leftSide=mo.x>0.35;
    bubble.classList.toggle("bl",leftSide); bubble.classList.toggle("br",!leftSide);
    bubble.style.left=(mo.x*r.width+(leftSide?-mw*0.36:mw*0.36))+"px";
    bubble.style.top=(mo.y*r.height+mh*0.42)+"px";
  }
  function drawMochi(){
    if(!ui.mochi) return;
    placeMochi();
    const t=mo.t, sq=mo.sq, sxs=1+sq, sys=1-sq*0.85;
    const w=15*sxs, h=12*sys;
    const jit=mo.shake?((((t*30)|0)%2)?1:-1):0;
    const cx=24+jit, by=37+mo.floatY, cy=by-h, lean=mo.lean*3;
    const cold=mo.mood==="cold";
    const BODY=cold?[236,244,255]:[255,243,246], SHADE=cold?[206,220,240]:[241,205,216], LINE=[74,47,61];
    MD.fill(0); mask.fill(0);
    // ground shadow (shrinks while floating up)
    const shW=w*(0.78-mo.floatY*0.03);
    for(let x=0;x<MW;x++) if(Math.abs(x+0.5-24)<shW){ for(const y of [41,42]){ const i=(y*MW+x)*4; MD[i+3]=y===41?70:40; } }
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
      let dy=(y+0.5-cy)/h; const dx=(x+0.5-cx-lean*(by-(y+0.5))/h)/w;
      if(dy>0) dy*=1.18;
      if(dx*dx+dy*dy<=1){ const j=y*MW+x; mask[j]=1; mdx[j]=dx; mdy[j]=dy; }
    }
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
      const j=y*MW+x; if(!mask[j]) continue;
      const edge=x===0||y===0||x===MW-1||y===MH-1||!mask[j-1]||!mask[j+1]||!mask[j-MW]||!mask[j+MW];
      let c=BODY;
      if(edge) c=LINE;
      else if(mdx[j]*0.35+mdy[j]*0.9>0.5) c=SHADE;
      else if((mdx[j]+0.45)**2+(mdy[j]+0.5)**2<0.03) c=[255,255,255];
      const i=j*4; MD[i]=c[0]; MD[i+1]=c[1]; MD[i+2]=c[2]; MD[i+3]=255;
    }
    mctx.putImageData(mimg,0,0);
    const E="#2b1b25", PINK="#e0607a";
    const px=(x,y,c)=>{ mctx.fillStyle=c; mctx.fillRect(Math.round(x),Math.round(y),1,1); };
    const rr=(x,y,ww,hh,c)=>{ mctx.fillStyle=c; mctx.fillRect(Math.round(x),Math.round(y),ww,hh); };
    const fxAt=y=>cx+lean*(by-y)/h;
    const ey=Math.round(cy-1.5*sys)+mo.ly, my=Math.round(cy+3*sys);
    const exL=Math.round(fxAt(ey)-6*sxs)+mo.lx, exR=Math.round(fxAt(ey)+6*sxs)+mo.lx, mx=Math.round(fxAt(my))+mo.lx;
    // cheeks
    const blush=mo.fx.includes("blush")?"#ff86a6":"#ffb8c9";
    rr(Math.round(fxAt(my)-11*sxs),my-1,3,2,blush); rr(Math.round(fxAt(my)+9*sxs),my-1,3,2,blush);
    const noBlink=new Set(["happy","closed","sleep","><","star","dizzy","x","wink"]);
    function eye(x,y,type,left){
      if(mo.blink>0&&!noBlink.has(type)) type="closed";
      if(type==="sleepy") type=((t*0.5)|0)%3===0?"closed":"dot";
      switch(type){
        case "dot": rr(x-1,y-1,2,3,E); px(x-1,y-1,"#fff"); break;
        case "closed": rr(x-1,y,3,1,E); break;
        case "happy": px(x-1,y,E); px(x,y-1,E); px(x+1,y,E); break;
        case "sleep": px(x-1,y,E); px(x,y+1,E); px(x+1,y,E); break;
        case "wide": rr(x-1,y-2,3,4,E); px(x-1,y-2,"#fff"); break;
        case "star": { const Y=((t*6)|0)%2?"#ffcf3a":"#ffe27a"; rr(x,y-2,1,5,Y); rr(x-2,y,5,1,Y); px(x,y,"#fff"); break; }
        case "dizzy": rr(x-1,y-1,3,1,E); rr(x-1,y+1,3,1,E); px(x-1,y,E); px(x+1,y,E); if(((t*8)|0)%2) px(x,y,E); break;
        case "x": px(x-1,y-1,E); px(x+1,y-1,E); px(x,y,E); px(x-1,y+1,E); px(x+1,y+1,E); break;
        case "><": if(left){ px(x-1,y-1,E); px(x,y,E); px(x-1,y+1,E); } else { px(x+1,y-1,E); px(x,y,E); px(x+1,y+1,E); } break;
        case "sad": rr(x-1,y-1,2,3,E); px(x-1,y-1,"#fff"); if(left){ px(x-2,y-3,E); px(x-1,y-4,E); } else { px(x+1,y-3,E); px(x,y-4,E); } break;
        case "wink": if(left){ rr(x-1,y-1,2,3,E); px(x-1,y-1,"#fff"); } else { px(x-1,y,E); px(x,y-1,E); px(x+1,y,E); } break;
      }
    }
    eye(exL,ey,mo.eyes,true); eye(exR,ey,mo.eyes,false);
    switch(mo.mouth){
      case "cat": px(mx-2,my,E); px(mx-1,my+1,E); px(mx,my,E); px(mx+1,my+1,E); px(mx+2,my,E); break;
      case "smile": px(mx-2,my,E); rr(mx-1,my+1,3,1,E); px(mx+2,my,E); break;
      case "o": rr(mx-1,my,3,3,E); px(mx,my+1,PINK); break;
      case "small": rr(mx,my,2,2,E); break;
      case "D": rr(mx-2,my,5,3,E); rr(mx-1,my+1,3,1,PINK); break;
      case "flat": rr(mx-1,my+1,3,1,E); break;
      case "wavy": px(mx-2,my+1,E); px(mx-1,my,E); px(mx,my+1,E); px(mx+1,my,E); px(mx+2,my+1,E); break;
    }
    // effects
    const fx=mo.fx;
    if(fx.includes("zzz")) for(let i=0;i<3;i++){
      const ph=(t*0.45+i/3)%1, zx=Math.round(cx+w-3+ph*8), zy=Math.round(cy-h-1-ph*12);
      mctx.globalAlpha=1-ph; rr(zx,zy,3,1,"#a9b8ff"); px(zx+1,zy+1,"#a9b8ff"); rr(zx,zy+2,3,1,"#a9b8ff"); mctx.globalAlpha=1;
    }
    if(fx.includes("sweat")){ const sx=Math.round(cx+w-4), sy=Math.round(cy-h+3)+(((t*2)%1)*3|0); px(sx,sy,"#bfe6ff"); rr(sx-1,sy+1,3,2,"#6cc0ff"); px(sx-1,sy+1,"#fff"); }
    if(fx.includes("sparkle")) for(let i=0;i<3;i++){
      if(((t*7+i)|0)%2) continue;
      const a=t*2.2+i*2.1, sx=Math.round(cx+Math.cos(a)*(w+3)), sy=Math.round(cy-2+Math.sin(a)*(h+2));
      rr(sx,sy-1,1,3,"#ffd94a"); rr(sx-1,sy,3,1,"#ffd94a");
    }
    if(fx.includes("puff")){
      const age=clamp(1.3-mo.evT,0,1.3);
      mctx.globalAlpha=clamp(1-age/1.3,0,1); mctx.fillStyle="#d7dde6";
      for(let i=0;i<3;i++){ const r=1+i+age*2, bx=cx+w-2+age*7+i*3, byy=cy-h+1-age*6-i*2;
        for(let k=-Math.round(r);k<=Math.round(r);k++){ const ww=Math.sqrt(Math.max(0,r*r-k*k)); mctx.fillRect(Math.round(bx-ww),Math.round(byy+k),Math.max(1,Math.round(ww*2)),1); } }
      mctx.globalAlpha=1;
    }
    if(Math.abs(S.v*3.6)>90 && S.ignition){
      mctx.fillStyle="rgba(255,255,255,.75)";
      for(let i=0;i<4;i++){ const yy=Math.round(cy-6+i*4), len=4+(i*7)%3, xx=Math.round(cx-w-4-((t*90+i*11)%14)); mctx.fillRect(xx,yy,len,1); }
    }
  }
  // drag to move, tap to poke
  let drag=null;
  mochiCanvas.addEventListener("pointerdown",e=>{
    const r=stage.getBoundingClientRect();
    drag={sx:e.clientX,sy:e.clientY,ox:mo.x,oy:mo.y,w:r.width,h:r.height,moved:false};
    mochiCanvas.setPointerCapture(e.pointerId); mochiCanvas.classList.add("drag");
  });
  mochiCanvas.addEventListener("pointermove",e=>{
    if(!drag) return;
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4){ drag.moved=true; mo.held=true; }
    if(!drag.moved) return;
    mo.x=clamp(drag.ox+(e.clientX-drag.sx)/drag.w,0.08,0.92);
    mo.y=clamp(drag.oy+(e.clientY-drag.sy)/drag.h,-0.02,0.88);
  });
  const endDrag=()=>{
    if(!drag) return;
    if(!drag.moved){ mo.sqV+=3.2; mo.evMood="poke"; mo.evT=0.9; mo.mood=""; }
    else mo.sqV+=2;
    drag=null; mo.held=false; mochiCanvas.classList.remove("drag");
  };
  mochiCanvas.addEventListener("pointerup",endDrag);
  mochiCanvas.addEventListener("pointercancel",endDrag);

  /* ============================== MENU ============================== */
  ui.volume=0.8; ui.road=true; ui.mochi=true;

  function toggle(id,fn){ const b=$(id); b.addEventListener("click",()=>{ const on=!b.classList.contains("on"); b.classList.toggle("on",on); fn(on); }); return b; }
  const pauseBtn=toggle("btnPause",on=>{ ui.paused=on; });

  function syncMenu(){

  /* ============================== DRAW ============================== */
  const font=(size,weight="normal")=>`${weight} ${size}px Consolas, "Courier New", monospace`;
  function text(str,x,y,size=8,color=C.white,align="left",weight="normal"){
    ctx.font=font(size,weight); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline="middle";
    ctx.fillText(String(str),x,y);
  }
  function line(x1,y1,x2,y2,color=C.dim,w=1){ ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
  function ring(cx,cy,r,start,end,color,width=1){ ctx.beginPath(); ctx.arc(cx,cy,r,start,end); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke(); }
  function drawTurn(x,y,left,on){
    ctx.fillStyle=on?C.green:"#26342b";
    ctx.beginPath();
    if(left){ ctx.moveTo(x-9,y);ctx.lineTo(x,y-7);ctx.lineTo(x,y-3);ctx.lineTo(x+8,y-3);ctx.lineTo(x+8,y+3);ctx.lineTo(x,y+3);ctx.lineTo(x,y+7); }
    else { ctx.moveTo(x+9,y);ctx.lineTo(x,y-7);ctx.lineTo(x,y-3);ctx.lineTo(x-8,y-3);ctx.lineTo(x-8,y+3);ctx.lineTo(x,y+3);ctx.lineTo(x,y+7); }
    ctx.closePath(); ctx.fill();
  }
  function drawVerticalGauge(x,top,labelTop,labelBottom,value,max,color,segments=8){
    text(labelTop,x+1,top-6,8,C.white,"center");
    text(labelBottom,x+1,top+segments*6+6,8,C.white,"center");
    for(let i=0;i<segments;i++){
      const active=i<Math.round(value/max*segments);
      rect(x-3,top+i*6,7,4,active?color:"#303844");
    }
  }
  const SPEED_MAX=220;
  function drawSpeedometer(kmh){
    const cx=160, cy=91, r=82, start=Math.PI;
    ring(cx,cy,r,start,0,"#d6d9df",1.3);
    for(let i=0;i<=22;i++){
      const a=start-(i/22)*Math.PI, major=i%2===0, inner=r-(major?9:4);
      line(cx+Math.cos(a)*inner,cy-Math.sin(a)*inner,cx+Math.cos(a)*(r+1),cy-Math.sin(a)*(r+1),"#c8cdd5",major?1.2:.7);
      if(major) text(i*10,cx+Math.cos(a)*(r-20),cy-Math.sin(a)*(r-20),8,C.white,"center");
    }
    text("km/h",160,47,9,C.muted,"center");
    const v=clamp(kmh/SPEED_MAX,0,1), a=start-v*Math.PI;
    line(cx,cy,cx+Math.cos(a)*66,cy-Math.sin(a)*66,C.red,2);
    rect(cx-3,cy-3,6,6,C.white);
    text(Math.round(Math.abs(S.v*3.6)),160,111,29,C.white,"center","bold");
    text("km/h",160,132,8,C.muted,"center");

  // little RPM gate: ramped bar segments, 500 rpm each, redline 6500

      const h=Math.round(3+i*0.45);
      const lit=rpm>i*500+250;
      let col=i>=13?C.red:i>=12?C.amber:"#cbd2dc";
      if(S.limiter && i>=12 && !blinkOn) col=C.off;
      rect(x0+i*5,base-h,4,h,lit?col:C.off);

    text("RPM",x0+26,31,7,C.muted);

  function drawBoost(map,sweep){
    const x0=212, base=23, g=sweep!=null?sweep*1.4:map-1;

      const h=Math.round(3+i*0.45);

  function draw(now){

    else if(S.manual && S.rpm>6000 && S.vgear<6 && blinkOn) text("▲ SHIFT UP",202,135,7,C.green,"left","bold");
    else if(S.limiter) text("REV LIMIT",202,135,7,C.red,"left","bold");

    // lower info rows
    line(8,150,312,150,"#333b47",1);
    text("OIL P",12,162,8,C.white);
    text(S.oilPressure.toFixed(1)+" bar",79,162,9,C.white);
    text("C.TEMP",205,162,8,C.white);
    text(Math.round(S.coolant)+"°C",305,162,9,C.white,"right");
    text("OIL T",12,179,8,C.white);
    text(Math.round(S.oilTemp)+"°C",61,179,9,C.white);
    text("LEVEL",112,179,7,C.muted);
    text(Math.round(S.oilLevel)+"%",158,179,9,S.oilLevel<20?C.red:C.white);
    text("▣ VOLT",205,179,8,C.white);
    text(S.voltage.toFixed(1)+"V",305,179,9,S.voltage<11.5?C.amber:C.white,"right");

    rect(141,139,38,27,C.bg);

    let gl=S.gear;

  const pad=$("pad");
  const isTouch=matchMedia("(hover: none) and (pointer: coarse)").matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const vkey=(key,type)=>window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true,cancelable:true}));
  const PAD_KEYS={ up:"+", down:"-", left:"ArrowLeft", right:"ArrowRight", a:"ArrowUp", b:"ArrowDown", start:"i", select:"Escape" };
  const HOLD=new Set(["a","b"]);
  function setPad(on){
    ui.pad=on; document.body.classList.toggle("has-pad",on); padBtn.classList.toggle("on",on);
    if(on){ hintEl.classList.add("hidden"); $("btnKeys").classList.remove("on"); }
  }
  pad.querySelectorAll("[data-k]").forEach(el=>{
    const id=el.dataset.k;
    const press=e=>{
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      if(!audio.userOff && (!audio.ctx || audio.ctx.state!=="running")) startAudio();
      if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8);
      el.classList.add("down");
      if(dl.open && dl.modal){ advanceDialog(); el._skip=true; return; }
      el._skip=false;
      if(id.startsWith("g:")){ vkey(id.slice(2).toLowerCase(),"keydown"); vkey(id.slice(2).toLowerCase(),"keyup"); return; }
      if(id==="hb"){ S.handbrake=!S.handbrake; return; }
      const key=PAD_KEYS[id];
      vkey(key,"keydown");
      if(!HOLD.has(id)) vkey(key,"keyup");
    };
    const release=()=>{
      el.classList.remove("down");
      if(!el._skip && HOLD.has(id)) vkey(PAD_KEYS[id],"keyup");
      el._skip=false;
    };
    el.addEventListener("pointerdown",press);
    el.addEventListener("pointerup",release);
    el.addEventListener("pointercancel",release);
    el.addEventListener("lostpointercapture",()=>{ if(el.classList.contains("down")) release(); });

    if(k==="arrowleft"){ ui.left=!ui.left; if(ui.left) ui.right=false; }
    if(k==="arrowright"){ ui.right=!ui.right; if(ui.right) ui.left=false; }
    if(gearKeys[k]) sim.selectGear(gearKeys[k]);
    if(k==="+"||k==="="||e.code==="NumpadAdd") sim.manualShift(1);
    if(k==="-"||k==="_"||e.code==="NumpadSubtract") sim.manualShift(-1);
    if(k==="i") sim.ignitionPress();
    if(k==="escape") ui.paused=!ui.paused;
    if(k===" ") S.handbrake=true;
  },{passive:false});
  window.addEventListener("keyup",e=>{
    const k=e.key.toLowerCase(); keys.delete(k);
    if(k===" ") S.handbrake=false;
  });
  window.addEventListener("blur",()=>{ keys.clear(); S.pedal=0; S.brake=0; S.handbrake=false; });

  /* ============================== LOOP ============================== */
  function frame(now){
    const dt=Math.min((now-ui.last)/1000,0.05); ui.last=now;
    if(ui.failed) ui.failT+=dt;
    if(!ui.paused && !ui.failed){
      const target=keys.has("arrowup")&&S.ignition?(keys.has("shift")?0.45:1):0;
      S.pedal=target>S.pedal?Math.min(target,S.pedal+dt*2.4):Math.max(target,S.pedal-dt*4.5);
      S.brake=keys.has("arrowdown")?Math.min(1,S.brake+dt*2.5):Math.max(0,S.brake-dt*4);
      ui.blinkClock+=dt;
      if(ui.blinkClock>=0.4){
        ui.blinkClock=0; ui.blink=!ui.blink;
        if((ui.left||ui.right)&&S.ignition) audio.event({type:"tick",amt:ui.blink?0.5:0.32});
      }
      const n=Math.max(1,Math.ceil(dt/0.004));
      for(let i=0;i<n;i++) sim.step(dt/n);
      S.sweepT+=dt;
      ui.dispSpeed=lerp(ui.dispSpeed,Math.abs(S.v*3.6),clamp(dt*7,0,1));
      ui.dispRpm=lerp(ui.dispRpm,S.rpm,clamp(dt*14,0,1));
      ui.rpmNumT-=dt;
      if(ui.rpmNumT<=0){ ui.rpmNumT=0.1; ui.rpmNum=Math.round(S.rpm/10)*10; }
      updateRoad(dt);
    }
    if(audio.on){
      const run=S.engine==="running";
      audio.send({
        rpm:S.rpm, load:clamp(S.comb/S.P.maxTq+(S.blipT>0?0.45:0),0,1.2), thr:S.thr,
        turbo:S.turbo, boost:Math.max(0,S.map-1), starter:S.engine==="cranking"?1:0,
        speed:Math.abs(S.v*3.6), cut:S.cut?1:0, running:run?1:0,
        pop:(S.gear==="S"||S.manual)?S.popWin:0, vol:(ui.paused||(ui.failed&&ui.failT>0.7))?0:ui.volume
      });
    }
    draw(now);
    drawRoad(now);
    updateMochi(dt);
    drawMochi();
    syncMenu();
    syncPad();
    updateDialog(dt);
    requestAnimationFrame(frame);
  }
  draw(performance.now());
  requestAnimationFrame(frame);
})();
</script>
