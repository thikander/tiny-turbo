<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Turbo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; touch-action:none; overscroll-behavior:none; }
  *, *::before, *::after { touch-action:none; -webkit-tap-highlight-color:transparent; }
  input[type=range] { touch-action:none; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    padding:10px 16px; font-family:Consolas, "Courier New", monospace;
  }
  .menu {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px;
    padding:4px; max-width:94vw; background:#05080d; border:1px solid #1a212c;
    box-shadow:inset 0 0 0 1px #000, 0 0 12px rgba(22,143,224,.06);
  }
  .mb {
    display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px;
    font:10px Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", monospace; letter-spacing:.08em; color:#7f8998;
    background:#0a0e15; border:1px solid #232b37; cursor:pointer; user-select:none;
  }
  .mb:hover { color:#f2f3f5; border-color:#5d6879; }
  .mb:active { transform:translateY(1px); }
  .mb .led { width:6px; height:6px; background:#1c232d; flex:none; }
  .mb.on { color:#e3e7ec; }
  .mb.on .led { background:#00f13c; box-shadow:0 0 5px #00f13c; }
  .mb.warn { color:#ffb72b; border-color:#7a5a1c; }
  .mb.ok { color:#00f13c; border-color:#1f6b35; }
  .mb.vol { cursor:default; }
  .mb.vol input { width:72px; height:12px; margin:0; accent-color:#168fe0; cursor:pointer; }
  .mb b { color:#00f13c; font-weight:bold; }
  .sep { display:none; }
  .gearbtn {
    position:fixed; top:10px; right:10px; z-index:21; width:36px; height:36px; display:grid; place-items:center;
    background:#0a0e15; border:1px solid #232b37; color:#7f8998; cursor:pointer; padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .gearbtn:hover, .gearbtn.on { color:#f2f3f5; border-color:#5d6879; }
  .gearbtn.on svg { transform:rotate(45deg); }
  .gearbtn svg { transition:transform .2s steps(2); }
  .menu {
    position:fixed !important; top:52px; right:10px; z-index:20; width:252px; max-width:calc(100vw - 20px);
    display:none !important; justify-content:flex-start !important;
  }
  .menu.open { display:flex !important; }
  .menu .mb { flex:1 1 calc(50% - 4px); height:30px !important; font-size:10px !important; padding:0 10px !important; }
  .menu .mb.vol { flex-basis:100%; }
  .menu .mb.vol input { flex:1; width:auto !important; }
  .mtitle { flex-basis:100%; padding:4px 6px 2px; font:bold 9px Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", monospace; letter-spacing:.16em; color:#4c5564; }
  .stage {
    position:relative; width:min(560px, 94vw, calc((100vh - 70px) * 0.947));
    filter: drop-shadow(0 0 2px rgba(140,160,190,.12));
  }
  .stage.noroad { width:min(560px, 94vw, calc((100vh - 70px) * 1.616)); }
  .stage.noroad #road { display:none; }
  .stage canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  #mochi {
    position:absolute; width:17%; cursor:grab; touch-action:none; z-index:2;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
  }
  #mochi.drag { cursor:grabbing; }
  #mochi.hidden, #bubble.hidden { display:none; }
  #bubble {
    position:absolute; z-index:3; transform:translate(-50%,-100%); pointer-events:none;
    padding:3px 6px; background:#fff3f6; color:#2b1b25; border:2px solid #4a2f3d;
    font:bold 10px/1.25 Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", monospace; letter-spacing:.04em; white-space:nowrap;
    opacity:0; transition:opacity .15s;
  }
  #bubble.show { opacity:1; }
  #bubble.bl { transform:translate(-100%,-50%); }
  #bubble.br { transform:translate(0,-50%); }
  #bubble::after { content:""; position:absolute; top:50%; margin-top:-4px; border:4px solid transparent; }
  #bubble.bl::after { right:-10px; border-left-color:#4a2f3d; }
  #bubble.br::after { left:-10px; border-right-color:#4a2f3d; }
  .hint {
    text-align:center; color:#3c4350; font:10px/1.5 Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", monospace; letter-spacing:.06em;
    user-select:none;
  }
  .hint.hidden { display:none; }
  .hint b { color:#6b7484; font-weight:normal; }
  html[lang=th] .menu .mb, html[lang=th] .hint { font-size:11px !important; letter-spacing:.02em; }
  html[lang=th] .mtitle { font-size:11px; letter-spacing:.04em; }
  html[lang=th] .pad { font-size:10px; letter-spacing:.02em; }
  html[lang=th] .g.hb { font-size:10px; }

  /* ---------- help dialog ---------- */
  #fail {
    position:absolute; inset:0; z-index:8; display:none; place-items:center;
    background:#03060b; color:#f2f3f5; border:1px solid #7d8796; cursor:pointer;
    font:bold clamp(34px, 10vw, 60px) Consolas, "Courier New", monospace; letter-spacing:.04em;
    user-select:none; -webkit-user-select:none;
  }
  #fail.show { display:grid; }
  #dialog {
    position:absolute; left:6%; right:6%; bottom:4%; z-index:5; display:none;
    padding:12px 14px 14px; background:#05080d; color:#f2f3f5;
    border:3px solid #f2f3f5; box-shadow:0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.55);
    font:bold 13px/1.6 Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", "Courier New", monospace; letter-spacing:.02em; cursor:pointer;
    user-select:none; -webkit-user-select:none;
  }
  #dialog.show { display:block; }
  #dialog.tip { bottom:auto; top:4%; border-color:#ffb72b; }
  #dialog.tip #dlgTitle { background:#ffb72b; }
  #dlgTitle {
    position:absolute; top:-13px; left:10px; padding:1px 7px; background:#f2f3f5; color:#05080d;
    font:bold 10px Consolas, monospace; letter-spacing:.1em; white-space:pre;
  }
  #dlgText { min-height:2.9em; }
  #dlgText .k {
    display:inline-block; min-width:1.5em; padding:0 4px; margin:0 1px; text-align:center;

  }

  /* ---------- touch pad (handheld style) ---------- */
  .pad {
    position:fixed; left:0; right:0; bottom:0; z-index:10; display:none;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));

    box-shadow:0 -8px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.65);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    font:bold 9px Consolas, "Leelawadee UI", Tahoma, "Noto Sans Thai", monospace; letter-spacing:.08em; color:#45415a;
  }
  body.has-pad .pad { display:block; }
  .pad [data-k] { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .gears { display:flex; justify-content:center; gap:6px; margin-bottom:12px; }
  .g {
    min-width:34px; height:26px; padding:0 6px; border-radius:7px; display:grid; place-items:center;
    background:#4a4752; color:#e8e6ee; font-size:12px; box-shadow:0 3px 0 #2a2830;
  }
  .g.on { background:#f02b32; color:#fff; box-shadow:0 3px 0 #8a1218; }
  .g.hb { margin-left:6px; font-size:10px; }
  .g.hb.on { background:#ffb72b; color:#2a2016; box-shadow:0 3px 0 #8a5d10; }
  .prow { display:flex; align-items:center; justify-content:space-between; max-width:460px; margin:0 auto; }
  .dpad { position:relative; width:126px; height:126px; flex:none; }
  .dpad .d { position:absolute; width:42px; height:42px; background:#26252b; display:grid; place-items:center; color:#5d5a66; font-size:12px; }
  .dpad .d.u { left:42px; top:0; border-radius:6px 6px 0 0; }
  .dpad .d.dn { left:42px; top:84px; border-radius:0 0 6px 6px; }
  .dpad .d.l { left:0; top:42px; border-radius:6px 0 0 6px; }
  .dpad .d.r { left:84px; top:42px; border-radius:0 6px 6px 0; }
  .dpad .c { position:absolute; left:42px; top:42px; width:42px; height:42px; background:#26252b; }
  .dpad .c::after { content:""; position:absolute; inset:13px; border-radius:50%; background:#1c1b20; }
  .dpad::before { content:""; position:absolute; inset:0; background:
      linear-gradient(#26252b,#26252b) 42px 0/42px 126px no-repeat, linear-gradient(#26252b,#26252b) 0 42px/126px 42px no-repeat;
    filter:drop-shadow(0 4px 0 #15141a); }
  .dpad .lbl { position:absolute; font-size:8px; color:#6a667a; white-space:nowrap; }
  .mid { display:flex; gap:14px; transform:rotate(-25deg); align-self:flex-end; margin-bottom:6px; }
  .pill { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .pill i { display:block; width:42px; height:12px; border-radius:8px; background:#8d8a93; box-shadow:inset 0 -2px 0 #6d6a73, 0 2px 0 #5f5c66; }
  .ab { position:relative; width:132px; height:112px; transform:rotate(-25deg); flex:none; }
  .ab .bt { position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ab .bt i { display:grid; place-items:center; width:54px; height:54px; border-radius:50%; font-style:normal; font-size:15px; color:#f6d6e2;
    background:radial-gradient(circle at 35% 30%,#c23a72,#9b2257 60%); box-shadow:0 4px 0 #5e1233; }
  .ab .bt.a { right:0; top:0; }
  .ab .bt.b { left:0; top:42px; }
  .down i, .d.down, .g.down { transform:translateY(2px); filter:brightness(.85); }
  .down i { box-shadow:0 2px 0 #5e1233; }

  body.has-pad { padding-bottom:calc(228px + env(safe-area-inset-bottom)); }
  body.has-pad .stage { width:min(560px, 94vw, calc((100dvh - 300px) * 0.947)); }
  body.has-pad .stage.noroad { width:min(560px, 94vw, calc((100dvh - 300px) * 1.616)); }
  @media (orientation:landscape) and (max-height:540px) {
    body.has-pad { padding:6px 200px; }
    body.has-pad { gap:6px; justify-content:flex-start; }
    body.has-pad .menu { gap:2px; padding:2px; }
    body.has-pad .mb { height:20px; padding:0 6px; font-size:9px; gap:4px; }
    body.has-pad .mb.vol input { width:48px; }
    body.has-pad .sep { display:none; }
    body.has-pad .stage { width:min(560px, calc(100vw - 410px), calc((100dvh - 24px) * 0.947)); }
    body.has-pad .stage.noroad { width:min(560px, calc(100vw - 410px), calc((100dvh - 24px) * 1.616)); }
    .pad { inset:0; padding:0; background:none; box-shadow:none; border-radius:0; pointer-events:none; color:#8b929d; }
    .pad .prow { display:contents; }
    .gears { position:fixed; left:14px; top:14px; width:176px; flex-wrap:wrap; justify-content:flex-start; pointer-events:auto; }
    .g.hb { margin-left:0; }
    .dpad { position:fixed; left:30px; bottom:22px; pointer-events:auto; }
    .mid { position:fixed; right:34px; top:64px; transform:none; pointer-events:auto; }
    .ab { position:fixed; right:22px; bottom:26px; pointer-events:auto; }
  }
</style>
</head>
<body>
<button id="btnSettings" class="gearbtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor"><path d="M7 0h2v2h2v1h1v-1h2v2h-1v1h1v2h2v2h-2v2h-1v1h1v2h-2v-1h-1v1h-2v2h-2v-2h-2v-1h-1v1h-2v-2h1v-1h-1v-2h-2v-2h2v-2h1v-1h-1v-2h2v1h1v-1h2zM6 5v1h-1v4h1v1h4v-1h1v-4h-1v-1z"/></svg></button>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("cluster");
  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const C = {
    bg:"#03060b", white:"#f2f3f5", muted:"#8b929d", dim:"#343b46", off:"#222933",
    red:"#f02b32", green:"#00f13c", blue:"#168fe0", amber:"#ffb72b"
  };
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;

  /* =====================================================================
     ENGINE SOUND SYNTH  (runs inside an AudioWorklet, or ScriptProcessor fallback)
     4-cylinder 4-stroke firing pulses (order 1-3-4-2) -> header + tailpipe
     waveguide resonances -> muffler. Plus intake, turbo whistle, blow-off
     valve, starter motor, CVT belt whine, road/wind, lever + drivetrain clunks.
     ===================================================================== */
  /*SYNTH-BEGIN*/
  const SYNTH_SRC = `
class SVF {
  constructor(){ this.ic1=0; this.ic2=0; this.a1=0; this.a2=0; this.a3=0; this.k=1; this.lp=0; this.hp=0; }
  set(fc,q,sr){ fc=Math.max(20,Math.min(fc,sr*0.45)); const g=Math.tan(Math.PI*fc/sr); this.k=1/q; this.a1=1/(1+g*(g+this.k)); this.a2=g*this.a1; this.a3=g*this.a2; }
  run(x){ const v3=x-this.ic2; const v1=this.a1*this.ic1+this.a2*v3; const v2=this.ic2+this.a2*this.ic1+this.a3*v3;
    this.ic1=2*v1-this.ic1; this.ic2=2*v2-this.ic2; this.lp=v2; this.hp=x-this.k*v1-v2; return v1; }
}
class EngineSynth {
  constructor(sr){
    this.sr=sr;
    this.t={rpm:0,load:0,thr:0,turbo:0,boost:0,starter:0,speed:0,cut:1,running:0,pop:0,vol:0,ign:0,brake:0,cold:0,crankP:0,rev:0,wg:0,rain:0,tunnel:0};
    this.rpm=0;this.load=0;this.thr=0;this.turbo=0;this.boost=0;this.starter=0;this.speed=0;this.vol=0;
    this.brake=0;this.wg=0;this.rain=0;this.tunnel=0;this.cold=0;this.cross=0;
    this.crank=0;this.lastFire=-1;
    const N=12;
    this.pa=new Float32Array(N);this.pt=new Float32Array(N).fill(1);this.ptau=new Float32Array(N).fill(0.001);this.pi=0;this.NP=N;
    this.cyl=[1.0,0.93,1.06,0.96];
    this.runner=[0,0.00021,0.00011,0.00031];
    // exhaust: header collector, mid pipe, tail pipe waveguides
    this.d1=new Float32Array(8192);this.d2=new Float32Array(8192);this.d3=new Float32Array(8192);this.di=0;
    this.l1=Math.round(sr*0.0056);this.l2=Math.round(sr*0.0023);this.l3=Math.round(sr*0.0034);
    this.f1=0;this.f2=0;this.f3=0;this.m1=0;this.m2=0;this.dcx=0;this.dcy=0;this.mc=0.05;
    this.echo=new Float32Array(16384);this.ei=0;
    this.drone=new SVF();this.raspF=new SVF();this.mechF=new SVF();this.intake=new SVF();this.whoosh=new SVF();
    this.bovF=new SVF();this.bovF2=new SVF();this.wgF=new SVF();this.wind=new SVF();this.tyre=new SVF();
    this.popF=new SVF();this.starterF=new SVF();this.clickF=new SVF();this.padF=new SVF();this.rainF=new SVF();
    this.creakF=new SVF();this.crashF=new SVF();this.glassF=new SVF();this.dropF=new SVF();
    this.road=0;this.road2=0;this.env=0;this.penv=0;
    this.tPh=0;this.sPh=0;this.wPh=0;this.thPh=0;this.sqPh=0;this.zPh=0;this.pPh=0;this.rvPh=0;this.rvT=0.9;this.tf=1000;this.wf=600;this.vib=0;
    this.bov=0;this.bovAmt=0;this.bovAge=1;
    this.thump=0;this.thumpAmt=0;this.thumpF=48;this.click=0;this.popEnv=0;
    this.pump=0;this.zing=0;this.creak=0;this.crash=0;this.glass=0;this.drop=0;this.thunder=0;this.crq=[];this.crk=0;this.crkHP=0;this.crkLP=0;this.thF=new SVF();this.thF.set(110,0.7,sr);
    this.squeal=false;this.sqF=3300;this.brakePrev=0;
    this.q=[];
    this.seed=22222;this.ctr=0;
    const e=(tc)=>Math.exp(-1/(sr*tc)); this.e=e;
    this.thDecay=e(0.075);this.clDecay=e(0.0035);this.popDecay=e(0.03);
    this.clickF.set(3200,0.9,sr);this.bovF2.set(650,1.3,sr);this.wind.set(1000,0.5,sr);
    this.popF.set(2400,0.6,sr);this.starterF.set(1150,1.6,sr);this.drone.set(96,4.5,sr);
    this.raspF.set(2700,0.75,sr);this.mechF.set(5400,1.8,sr);this.wgF.set(1700,1.1,sr);this.padF.set(2600,1.2,sr);
    this.rainF.set(4200,0.6,sr);this.creakF.set(520,7,sr);this.glassF.set(6200,4,sr);this.dropF.set(3000,3,sr);this.crashF.set(400,0.7,sr);
    this.updateFilters();
  }
  rnd(){ this.seed=(this.seed*1664525+1013904223)>>>0; return this.seed/4294967296; }

      if(S.crankPending>=0){ S.crankPending-=h; if(S.crankPending<0 && S.engine==="off"){ S.engine="cranking"; S.crankT=0; hooks.event({type:"solenoid"}); } }
      if(S.engine==="cranking"){

        if(S.crankT>0.65 && S.fuel>0.05 && S.rpm>150){ S.engine="running"; S.runT=0; S.idleI=0.1; hooks.event({type:"catch"}); }
        else if(S.crankT>3.0){ S.engine="off"; flash(S.fuel<=0.05?"NO FUEL":"NO START"); }
      }
      const running=S.engine==="running", cranking=S.engine==="cranking";
      if(running) S.runT+=h;
      const rpm=S.rpm, pedal=S.pedal;

      // ---- idle air control (PI) with cold fast-idle and start flare
      const idleTarget=P.idle+clamp((55-S.coolant)/35,0,1)*380+560*Math.exp(-S.runT/0.8);
      const err=idleTarget-rpm;
      const ff=isDrive(S.gear)&&!S.lock?0.06*clamp(S.engage*2-0.6,0,1):0; // idle-up when the converter is loaded
      const idleOpen=clamp(S.idleI+ff+err*0.0002,0,0.35);
      if(running && pedal<idleOpen) S.idleI=clamp(S.idleI+err*0.0004*h,0,0.25);
      let thr=running?Math.max(pedal,idleOpen):(cranking?0.08:0);

      // ---- fuel cut: rev limiter + deceleration fuel cut

        if(rpm>P.limit) S.limiter=true; else if(rpm<P.limitResume) S.limiter=false;
        // optional 180 km/h speed limiter (JDM style): fuel cut above the limit, back on 3 km/h below

        const coast=pedal<0.02 && ((S.lock && S.v>6) || ((S.gear==="P"||S.gear==="N") && rpm>1700));
        if(coast && rpm>1150) S.decelCut=true; else if(!coast || rpm<1000) S.decelCut=false;
      } else { S.limiter=false; S.decelCut=false; }
      S.cut=!running||S.limiter||S.vcut||S.decelCut||S.fuel<=0;
      S.thr=thr;

      // ---- manifold pressure + turbo
      const x=0.03+25*Math.pow(thr,2.2);
      const mapNA=Math.max(0.2,x/(x+rpm*0.0005+0.002));
      const sport=S.gear==="S"||S.manual;
      const maxBoost=sport?P.boostSport:P.boost;
      const boostAvail=maxBoost*Math.pow(clamp((S.turbo-0.22)/0.55,0,1),1.3);
      const mapT=mapNA*(1+boostAvail*Math.pow(mapNA,4));
      S.map+=(mapT-S.map)*Math.min(1,h*(mapT>S.map?9:14));
      const flow=(rpm/6000)*(S.cut?0.3:S.map);
      const sT=Math.pow(clamp((flow*P.flowK-P.lag)/(0.95-P.lag),0,1.1),0.8);
      const tRate=sT>S.turbo?0.5+2.4*flow:(S.bovT>0?1.7:0.8);

      }
      if(S.prevPedal>0.6 && pedal<=0.6 && rpm>3500) S.popWin=1;
      S.prevPedal=pedal;

      // ---- engine torque
      let comb=0;
      if(!S.cut) comb=Math.min(P.maxTq,naTorque(rpm)*(1+(P.flowK-1)*clamp((rpm-2500)/3000,0,1))*Math.max(0,(S.map-0.16)/0.84))*(S.tqCutT>0?0.55:1);
      S.comb=comb;

      } else S.engage=driveSel?Math.max(0,S.engage-h*2):0;
      const ef=clamp((S.engage-0.45)/0.4,0,1);

      // ---- powertrain + vehicle
      const dir=S.gear==="R"?-1:1;
      const k=(S.gear==="R"?P.rRev:S.ratio)*P.fd/P.rw;

      let bDec=S.brake*9.8+(S.handbrake?3.4:0)+(S.gear==="P"?25:0);

      const oilTarget=on?S.coolant+4+load*14:S.coolant;
      S.oilTemp=lerp(S.oilTemp,oilTarget,h*(S.oilTemp<oilTarget?0.006:0.0025));

      S.oilPressure=lerp(S.oilPressure,opT,clamp(h*6,0,1));
      S.oilLevel=clamp(S.oilLevel-(on?0.000015+(S.rpm/7000)*0.000025+load*0.000035:0)*h,0,100);
      const vT=!S.ignition?12.5:cranking?10.3+Math.sin(S.crankA*12.566)*0.4:on?14.1+Math.min(0.3,S.rpm/20000):12.2;
      S.voltage=lerp(S.voltage,vT,clamp(h*(cranking?20:4),0,1));

    }

    function selectGear(g){

    const body=ac.createBiquadFilter(); body.type="peaking"; body.frequency.value=95; body.Q.value=0.9; body.gain.value=4;
    body.connect(comp); comp.connect(ac.destination);

    forest: { g:[[46,96,52],[42,88,48]], sh:[112,102,86], rd:[[70,72,78],[66,68,74]], bg:"mtn", lamp:0, curvy:1.35, hilly:1.7, rainP:0.35, tunnel:1 },
    city:   { g:[[132,130,126],[122,120,116]], sh:[168,168,166], rd:[[64,66,72],[61,63,69]], bg:"city", lamp:7, lampC:[0.72,0.84,1.0], curvy:0.4, hilly:0.35, rainP:0.25, curb:true },
    coast:  { g:[[204,186,134],[196,178,126]], sea:true, sh:[156,146,116], rd:[[76,78,84],[72,74,80]], bg:"sea", lamp:12, lampC:[1,0.7,0.36], curvy:1.1, hilly:0.6, rainP:0.15 },
    paddy:  { g:[[104,158,66],[94,148,60]], paddy:true, sh:[128,110,82], rd:[[76,78,84],[72,74,80]], bg:"hills2", lamp:0, curvy:0.7, hilly:0.3, rainP:0.3 },
    highway:{ g:[[74,114,58],[68,106,54]], sh:[144,140,132], rd:[[66,68,74],[62,64,70]], bg:"hills2", lamp:10, lampC:[1,0.66,0.3], curvy:0.6, hilly:0.6, rainP:0.2 }
  };
  const BIOME_KEYS=Object.keys(BIOMES);

  // ---------- procedural track: curvature + grade random walks, biome zones, tunnels
  const track={ segs:[], base:-60 };
  const G={ n:-60, k:0, kT:0, kLeft:30, g:0, gT:0, gLeft:30, th:0, X:0, Y:0, zone:null, next:null, left:0, tunLeft:0 };
  function newZone(prev){
    let b; do{ b=BIOME_KEYS[(Math.random()*BIOME_KEYS.length)|0]; }while(b===prev);
    return { b, len:(280+Math.random()*420)|0, rain:Math.random()<BIOMES[b].rainP?0.45+Math.random()*0.55:0 };
  }
  function genSeg(){
    const n=G.n++;
    if(!G.zone){ G.zone=newZone("forest"); G.zone.rain=0; G.left=G.zone.len; G.next=newZone(G.zone.b); }
    if(G.left<=0){ G.zone=G.next; G.left=G.zone.len; G.next=newZone(G.zone.b); }
    G.left--;
    const B=BIOMES[G.zone.b], BLEND=60, mix=G.left<BLEND?1-G.left/BLEND:0;

    const tun=G.tunLeft>0;
    if(--G.kLeft<=0){ G.kT=Math.random()<0.3?0:(Math.random()*2-1)*0.0034*B.curvy; G.kLeft=50+((Math.random()*100)|0); }
    if(--G.gLeft<=0){ G.gT=Math.random()<0.3?0:(Math.random()*2-1)*0.05*B.hilly; G.gLeft=25+((Math.random()*60)|0); }
    const near0=n<25;
    G.k+=((tun||near0?G.kT*0.3:G.kT)-G.k)*0.05;
    G.g+=clamp((tun||near0?0:G.gT)-G.g,-0.003,0.003); G.g=clamp(G.g,-0.06,0.06);

  function segAt(n){ while(G.n<=n+1) genSeg(); const i=n-track.base; return track.segs[i<0?0:i]; }

  const TMP={};
  function at(s,o){ const n=Math.floor(s/SEG), sg=segAt(n), u=s-n*SEG;

  // ---------- camera + projection
  const CAM={ s:0, X:0, Y:0, th:0, g:0, h:1.25, lat:0, f:150, hy:HZ };
  const PQ={};
  function proj(s,x,y,o){
    const d=s-CAM.s; if(d<0.05){ o.ok=false; return o; }

  }

  // ---------- day clock, sky palette, weather
  const SKYK=[ // hour, top, mid, horizon, ambient light, stars
    [0,  "#04071a","#141434","#3a2850",[0.15,0.16,0.27],1],
    [4.4,"#070b24","#25234e","#5e3c62",[0.17,0.17,0.28],0.8],
    [5.6,"#25366e","#9a5a7c","#ffa86a",[0.5,0.42,0.45],0.15],
    [6.8,"#3f7fd0","#8fbde8","#f2dcb8",[0.92,0.88,0.84],0],
    [12, "#2f78d8","#77b6f0","#d2e8f6",[1,1,1],0],
    [16.6,"#3a76c8","#8fb8e0","#f2dcae",[1,0.95,0.84],0],
    [18.1,"#3a3f8a","#d0607a","#ffae4c",[0.82,0.56,0.46],0],
    [19.1,"#141a48","#4a2e6a","#b0507a",[0.34,0.27,0.38],0.35],
    [20.4,"#05081a","#1a1536","#5c3459",[0.16,0.17,0.28],1],
    [24, "#04071a","#141434","#3a2850",[0.15,0.16,0.27],1]
  ].map(k=>[k[0],hexc(k[1]),hexc(k[2]),hexc(k[3]),k[4],k[5]]);
  const ENV={ top:[0,0,0], mid:[0,0,0], hor:[0,0,0], amb:[1,1,1], stars:0, head:0, night:1, lamps:0, fogN:30, fogR:200, fogM:0.85, tun:0 };
  let FOGC=[64,38,76];
  function updateEnv(){
    const h=((road.hour%24)+24)%24;
    let i=0; while(i<SKYK.length-2 && SKYK[i+1][0]<=h) i++;
    const A=SKYK[i], B=SKYK[i+1], t=(h-A[0])/(B[0]-A[0]);
    const rain=road.rain, grey=c=>{ const l=(c[0]*0.3+c[1]*0.55+c[2]*0.15)*0.62; return mixc(c,[l,l,l*1.06],0.75*rain); };
    ENV.top=grey(mixc(A[1],B[1],t)); ENV.mid=grey(mixc(A[2],B[2],t)); ENV.hor=grey(mixc(A[3],B[3],t));
    const am=mixc(A[4],B[4],t).map(v=>v*(1-0.32*rain));
    ENV.stars=(A[5]+(B[5]-A[5])*t)*(1-rain);
    const lum=am[0]*0.3+am[1]*0.55+am[2]*0.15;
    ENV.night=clamp((0.75-lum)/0.5,0,1);
    if(road.flash>0){ const f=road.flash*1.4; am[0]+=f; am[1]+=f; am[2]+=f*1.1; }
    ENV.amb=am;
    ENV.tun=road.tunnel;
    ENV.lamps=ENV.night>0.25?1:0;
    ENV.head=S.ignition&&(ENV.night>0.2||rain>0.3||road.tunnel>0.5)?1:0;
    ENV.fogN=lerp(32,8,rain); ENV.fogR=lerp(230,120,rain); ENV.fogM=lerp(0.8,0.93,rain);

  }
  const L3=[0,0,0], LG=[0,0,0]; let HEADK=0;
  function lightAt(s,z,sg){
    let r=ENV.amb[0], g=ENV.amb[1], b=ENV.amb[2]; HEADK=0;
    if(sg.tun){ const k=0.62+0.3*Math.max(0,Math.cos(s/8*Math.PI*2)); r=r*0.15+0.95*k; g=g*0.15+0.62*k; b=b*0.15+0.32*k; }
    if(ENV.head){ const zc=s-road.pos-2.1;
      if(zc>-0.5){ const k=(zc<2?(zc+0.5)/2.5:1)*clamp(1-(zc-6)/52,0,1)*1.05; HEADK=k; r+=k; g+=k*0.95; b+=k*0.82; } }
    const B=BIOMES[sg.mix<0.5?sg.b:sg.nb];
    if(B.lamp && ENV.lamps && !sg.tun){ const sp=B.lamp*SEG/(B.curb?2:1), m=((s%sp)+sp)%sp, dd=Math.min(m,sp-m);
      if(dd<11){ const k=(1-(dd/11)*(dd/11))*0.85; r+=k*B.lampC[0]; g+=k*B.lampC[1]; b+=k*B.lampC[2]; } }
    L3[0]=Math.min(1.45,r); L3[1]=Math.min(1.45,g); L3[2]=Math.min(1.45,b); return L3;
  }
  const fogAt=z=>clamp((z-ENV.fogN)/ENV.fogR,0,ENV.fogM);
  const CA=[0,0,0];
  function shadeA(c,L,fog){
    const r=Math.min(255,c[0]*L[0]), g=Math.min(255,c[1]*L[1]), b=Math.min(255,c[2]*L[2]);
    CA[0]=r+(FOGC[0]-r)*fog; CA[1]=g+(FOGC[1]-g)*fog; CA[2]=b+(FOGC[2]-b)*fog; return CA;
  }
  const shade=(c,L,fog)=>{ const a=shadeA(c,L,fog); return "rgb("+(a[0]|0)+","+(a[1]|0)+","+(a[2]|0)+")"; };
  const ONE=[1,1,1];
  const emis=(c,fog)=>shade(c,ONE,fog*0.35);

  // per-segment blended palette (biome transitions crossfade)
  function palOf(sg){
    if(sg.palT===ui.frameNo) return sg.pal;
    const A=BIOMES[sg.b], B=BIOMES[sg.nb], m=sg.mix;
    const p=sg.pal||(sg.pal={g:[[0,0,0],[0,0,0]],sh:[0,0,0],rd:[[0,0,0],[0,0,0]]});
    for(let i=0;i<2;i++){ p.g[i]=mixc(A.g[i],B.g[i],m); p.rd[i]=mixc(A.rd[i],B.rd[i],m); }
    p.sh=mixc(A.sh,B.sh,m);
    p.sea=(m<0.5?A:B).sea; p.paddy=(m<0.5?A:B).paddy; p.curb=(m<0.5?A:B).curb;
    if(sg.tun){ p.g=[[118,114,108],[110,106,100]]; p.sh=[150,146,140]; p.sea=false; p.paddy=false; p.curb=true; }
    sg.palT=ui.frameNo; return p;
  }

  function updateRoad(dt){
    const v=S.v, kmh=v*3.6;
    road.pos+=v*dt;
    at(road.pos,TMP);
    road.k=TMP.k; road.heading=TMP.th; S.grade=TMP.g;
    const sg=TMP.sg;
    road.biome=sg.mix<0.5?sg.b:sg.nb;
    road.tunnel+=((sg.tun?1:0)-road.tunnel)*clamp(dt*3,0,1);
    road.rain+=(sg.rain-road.rain)*clamp(dt*0.12,0,1);
    road.wet+=(Math.min(1,road.rain*1.6)-road.wet)*clamp(dt*(road.rain>road.wet?0.2:0.03),0,1);
    road.hour+=dt/60;
    // lightning in heavy rain
    road.flash=Math.max(0,road.flash-dt*5);
    if(road.rain>0.75 && !sg.tun && Math.random()<dt*0.035){ road.flash=0.35+Math.random()*0.4; road.thunder=0.6+Math.random()*1.6; onSimEvent({type:"thunder"}); }
    if(road.thunder>0){ road.thunder-=dt; if(road.thunder<=0){ road.thunder=0; audio.event({type:"thunder",amt:0.5+Math.random()*0.5}); } }
    // lane change with the signal (left-hand traffic: home lane is the left one)
    let want=-1;
    if(kmh>8){
      want=ui.right&&road.lane===0?1:ui.left&&road.lane===1?0:-1;
      if(want>=0){ road.laneT+=dt; if(road.laneT>0.6){ road.lane=want; road.laneT=0; road.changing=true; } } else road.laneT=0;
    }
    const tx=road.lane?1.8:-1.8;
    // smooth lateral motion like a real lane change: about 3 s, max ~0.22 g sideways, slower at low speed
    const sp=clamp(Math.abs(kmh)/30,0,1), w0=2.2*sp;
    const latA=clamp((tx-road.camX)*w0*w0-(2*w0+(sp<0.05?0.6:0))*road.latV,-2.2,2.2);
    road.latA=latA; road.latV+=latA*dt; road.camX+=road.latV*dt;
    if(road.changing && Math.abs(tx-road.camX)<0.05){
      road.changing=false;                       // lane change done: self-cancel the indicator
      if(road.lane===1) ui.right=false; else ui.left=false;
    }
    // body pitch from acceleration (squat / nose dive)
    road.accF+=((v-road.lastV)/Math.max(dt,1e-3)-road.accF)*clamp(dt*5,0,1); road.lastV=v;
    road.pitch=clamp(-road.accF*0.0045,-0.035,0.035);
    if(Math.abs(kmh)>10 && Math.random()<dt*Math.abs(kmh)/180){
      road.bump=1; road.bumpKick=true;
      audio.event({type:"bump",amt:0.1+Math.random()*0.22,gap:2.6/Math.max(2,Math.abs(v))});
    }
    road.bump*=Math.exp(-dt*16);
    updateTraffic(dt);
  }

  // ---------- drawing helpers (all clipped against the crest line of their segment)
  let CLIP=RH;
  function R(x,y,w,h){ x=Math.round(x); y=Math.round(y); w=Math.max(1,Math.round(w)); h=Math.max(1,Math.round(h));
    if(y+h>CLIP) h=CLIP-y; if(h<=0) return; rc.fillRect(x,y,w,h); }
  function blob(x,y,r){ const Rr=Math.max(1,Math.round(r)); for(let i=-Rr;i<=Rr;i++){ const w=Math.sqrt(Rr*Rr-i*i); R(x-w,y+i,2*w,1); } }
  function quad(a,b,c,d,style){
    if(!a.ok||!b.ok||!c.ok||!d.ok) return;
    rc.save(); rc.beginPath(); rc.rect(0,0,RW,CLIP); rc.clip();
    rc.fillStyle=style; rc.beginPath(); rc.moveTo(a.x,a.y); rc.lineTo(b.x,b.y); rc.lineTo(c.x,c.y); rc.lineTo(d.x,d.y); rc.closePath(); rc.fill(); rc.restore();
  }
  const Q=[{},{},{},{},{},{},{},{}];
  // draws an axis-aligned 3D box: back face at s0, sides along the road, top. Returns the back face rect.
  function box(s0,s1,x0,x1,y0,y1,cBack,cSide,cTop){
    const front=s0>=CAM.s+NEAR, sA=Math.max(s0,CAM.s+NEAR);
    if(s1<=sA) return null;
    const so=s0; s0=sA;
    if(cSide && CAM.lat<x0){ const p=proj(s0,x0,y0,Q[2]), q=proj(s1,x0,y0,Q[3]), r=proj(s1,x0,y1,Q[4]), t=proj(s0,x0,y1,Q[5]); quad(p,q,r,t,cSide); }
    if(cSide && CAM.lat>x1){ const p=proj(s0,x1,y0,Q[2]), q=proj(s1,x1,y0,Q[3]), r=proj(s1,x1,y1,Q[4]), t=proj(s0,x1,y1,Q[5]); quad(p,q,r,t,cSide); }
    if(cTop){ const p=proj(s0,x0,y1,Q[2]), q=proj(s0,x1,y1,Q[3]), r=proj(s1,x1,y1,Q[4]), t=proj(s1,x0,y1,Q[5]); if(r.ok&&r.y<q.y) quad(p,q,r,t,cTop); }
    if(!front) return null;
    const a=proj(so,x0,y0,Q[0]), b=proj(so,x1,y1,Q[1]);

  }

  // ---------- sky + background
  function drawSky(now,hy){
    const sg=rc.createLinearGradient(0,0,0,hy+2);
    sg.addColorStop(0,rgbs(ENV.top)); sg.addColorStop(0.58,rgbs(ENV.mid)); sg.addColorStop(1,rgbs(ENV.hor));
    rc.fillStyle=sg; rc.fillRect(0,0,RW,hy+2);
    const head=CAM.th;
    if(ENV.stars>0.02){
      const sOff=head*120;
      for(const s of STARS){
        const x=(((s[0]-sOff)%640)+640)%640; if(x>=RW) continue;
        const tw=0.45+0.55*Math.abs(Math.sin(now/700+s[2]*20));
        rc.fillStyle="rgba(230,230,255,"+(tw*s[2]*ENV.stars).toFixed(2)+")"; rc.fillRect(x|0,s[1],1,1);
      }
      if(!road.shoot && Math.random()<0.002*ENV.stars) road.shoot={x:40+Math.random()*240,y:4+Math.random()*18,t:0};
    }
    if(road.shoot){ const s=road.shoot; s.t+=0.016; const x=s.x+s.t*160, y=s.y+s.t*50;
      rc.fillStyle="rgba(255,255,255,"+(1-s.t*2.2).toFixed(2)+")"; for(let i=0;i<6;i++) rc.fillRect((x-i*2)|0,(y-i*0.6)|0,1,1);
      if(s.t>0.45) road.shoot=null; }
    // sun / moon
    const h=((road.hour%24)+24)%24;
    const sunAlt=Math.sin((h-6)/12*Math.PI), sunAz=(h-6)/12*300+60;
    const mh=(h-18+24)%24, moonAlt=Math.sin(mh/12*Math.PI), moonAz=mh/12*300+90;
    const skyX=az=>(((az-head*140)%640)+640)%640;
    if(sunAlt>-0.12 && road.rain<0.6){
      const x=skyX(sunAz), y=hy-6-sunAlt*62, low=clamp(1-sunAlt/0.35,0,1);
      if(x<RW+20){
        const col=mixc([255,246,214],[255,120,50],low);
        halo(x,y,30+low*16,mixc([255,230,180],[255,110,60],low),0.55*(1-road.rain));
        rc.fillStyle=rgbs(col); blob(x,y,5+low*4);
        if(low>0.4){ rc.fillStyle=rgbs(ENV.mid,0.55); for(let i=0;i<3;i++) rc.fillRect(x-12,y+2+i*2.5,24,1); }
      }
    }
    if(moonAlt>-0.1 && road.rain<0.6){
      const x=skyX(moonAz), y=hy-8-moonAlt*58;
      if(x<RW+10){ halo(x,y,14,[200,210,255],0.25*ENV.night); rc.fillStyle="#efe6c8"; blob(x,y,4.5); rc.fillStyle="#d4c9a8"; rc.fillRect((x-2)|0,(y-2)|0,2,2); rc.fillRect((x+1)|0,(y+2)|0,1,1); }
      road.moonX=x;
    } else road.moonX=-99;
    road.sunX=sunAlt>-0.1?skyX(sunAz):-99;
    // clouds
    const lit=mixc(ENV.hor,[255,255,255],0.35*(1-ENV.night)), dark=mixc(ENV.top,ENV.mid,0.5);
    const cc=mixc(dark,lit,0.6), n=road.rain>0.3?8:5;
    for(let i=0;i<n;i++){
      const c=CLOUDS[i], x=(((c.x-head*90+now*0.002*(1+c.r))%800)+800)%800-60;
      if(x>RW+40) continue;
      const y=c.y*(road.rain>0.3?0.7:1), w=c.w*(road.rain>0.3?1.8:1);
      rc.fillStyle=rgbs(cc,0.55+0.35*road.rain);
      for(let k=0;k<4;k++){ const r=w*(0.25+0.15*((k*7+i)%3)); const bx=x+k*w*0.35, by=y-(k%2)*2; for(let j=-Math.round(r*0.5);j<=Math.round(r*0.5);j++){ const ww=Math.sqrt(Math.max(0,r*r*0.25-j*j))*2; rc.fillRect(Math.round(bx-ww),Math.round(by+j),Math.round(ww*2),1); } }
      rc.fillStyle=rgbs(lit,0.25*(1-ENV.night*0.6)); rc.fillRect(Math.round(x),Math.round(y-w*0.3),Math.round(w*1.1),1);
    }
  }
  function drawBg(type,alpha,hy){
    if(alpha<=0.01) return;
    rc.save(); rc.globalAlpha=alpha;
    const head=CAM.th, far=mixc(ENV.hor,mixc(ENV.top,[8,8,20],0.5),0.38), near=mixc(far,[6,8,14],0.45);
    const o1=head*55, o2=head*150, idx=(x,o)=>(((x+o)|0)%640+640)%640;
    const layer=(arr,o,c,sc)=>{ rc.fillStyle=rgbs(c); for(let x=0;x<RW;x++){ const h=arr[idx(x,o)]*sc; rc.fillRect(x,hy-h,1,h+1); } };
    if(type==="mtn"){ layer(MTN,o1,far,1.25); layer(HILL,o2,near,1.3); }
    else if(type==="hills"){ layer(HILL,o1,far,1.4); layer(HILL2,o2,near,1); }
    else if(type==="hills2"){ layer(HILL2,o1,far,1.1); layer(HILL,o2,near,0.6); }
    else if(type==="sea"){ layer(ISL,o1,far,1.6);
      const lx=idx(250,o1); if(lx<RW && ((performance.now()/900)|0)%3===0) { rc.fillStyle="#fff2b0"; rc.fillRect(lx,hy-5,1,1); } }
    else if(type==="city"){
      layer(HILL2,o1,far,0.7);
      const bc=mixc(near,ENV.hor,0.15);
      rc.fillStyle=rgbs(bc);
      for(let x=0;x<RW;x++){ const h=SKY[idx(x,o2*0.6)]; if(h) rc.fillRect(x,hy-h,1,h+1); }

  // ---------- main road frame

  const blurCan=document.createElement("canvas"); blurCan.width=RW; blurCan.height=RH;
  const bctx=blurCan.getContext("2d");
  const STREAKS=[]; for(let i=0;i<26;i++) STREAKS.push({a:Math.random()*Math.PI*2,r:Math.random(),v:0.6+Math.random()*0.8,w:Math.random()});
  function speedBlur(kmh,dt){
    const b=clamp((kmh-50)/170,0,1); if(b<0.01) return;
    const vx=160, vy=CAM.hy-2;
    bctx.clearRect(0,0,RW,RH); bctx.drawImage(roadCanvas,0,0);
    rc.save(); rc.imageSmoothingEnabled=true;
    for(let i=1;i<=4;i++){
      const s=1+0.014*i*b*(1+b);

      rc.drawImage(blurCan,vx-vx*s,vy-vy*s,RW*s,RH*s);
    }
    rc.restore();

    rc.save(); rc.lineWidth=1; rc.strokeStyle=rgbs(mixc(ENV.hor,[255,255,255],0.6),0.22*b); rc.beginPath();
    for(const st of STREAKS){
      st.r+=dt*st.v*(0.8+kmh/90); if(st.r>1){ st.r=0.25+Math.random()*0.2; st.a=Math.random()*Math.PI*2; st.w=Math.random(); }

  /* ============================== TRAFFIC GAME ==============================

  road.cars=[]; road.spawnT=3; ui.runKm=0; ui.failed=false; ui.failT=0;

  function spawnCar(){
    const lane=Math.random()<0.6?0:1, pos=road.pos+200+Math.random()*70;
    for(const c of road.cars){
      const gap=Math.abs(c.pos-pos);
      if(c.lane===lane&&gap<28) return;
      if(c.lane!==lane&&gap<18) return;      // always leave a way through
    }
    const cruise=(lane===0?44+Math.random()*30:68+Math.random()*30)/3.6;
    const type=CAR_TYPES[(Math.random()*CAR_TYPES.length)|0];
    road.cars.push({ pos, lane, x:lane?1.8:-1.8, v:cruise, cruise, type, paint:PAINTS[(Math.random()*PAINTS.length)|0],
      style:type==="van"?0:(Math.random()*LIGHTS.length)|0, brakeT:0, braking:false });
  }
  function updateTraffic(dt){
    if(ui.failed) return;
    if(!ui.traffic){ road.cars.length=0; return; }
    if(S.ignition) ui.runKm+=Math.abs(S.v)*dt/1000;
    const cars=road.cars;
    for(const c of cars){
      let target=c.cruise;
      c.brakeT-=dt; if(c.brakeT>0) target=c.cruise*0.55;
      else if(Math.random()<dt*0.006) c.brakeT=0.8+Math.random()*1.4;
      let lead=null;
      for(const o of cars) if(o!==c&&o.lane===c.lane&&o.pos>c.pos&&(!lead||o.pos<lead.pos)) lead=o;
      if(lead&&lead.pos-c.pos<35) target=Math.min(target,lead.v*(lead.pos-c.pos<16?0.8:1));
      c.braking=target<c.v-0.4;
      c.v+=clamp(target-c.v,-7*dt,2.2*dt);
      c.pos+=c.v*dt;
    }
    road.cars=cars.filter(c=>c.pos-road.pos<360&&c.pos-road.pos>-40);
    const kmh=S.v*3.6, want=ui.runKm<0.5?1:Math.min(3,1+Math.floor(ui.runKm/2));
    road.spawnT-=dt;
    if(kmh>15&&road.cars.length<want&&road.spawnT<=0){ spawnCar(); road.spawnT=6+Math.random()*10; }
    // collision: our front bumper is ~2.2 m ahead of the camera
    for(const c of road.cars){
      const dz=c.pos-road.pos;
      if(dz<2.3&&dz>-1.2&&Math.abs(c.x-road.camX)<1.7&&S.v>c.v-0.5&&S.v>1){ crash(); break; }
    }
  }

  const PAINTS=[[178,28,38],[30,60,142],[204,204,208],[30,30,34],[118,122,130],[236,236,232],[36,104,76],[210,150,40],[118,22,32],[64,92,120]];

    const tyre=shade([14,14,16],L,fg), rim=shade([150,150,156],L,fg);

      const p=proj(s+0.55,x+sd*(hw-0.2),0,P0), q=proj(s+0.55,x+sd*(hw-0.02),0.62,P1);

    }

  if(!ui.cluster) ui.cluster="digital";
  const AN_START=215*Math.PI/180, AN_SWEEP=250*Math.PI/180;
  const DIAL_FONT='Arial, Helvetica, sans-serif';
  let plateTex=null;
  function makePlate(){
    const c=document.createElement("canvas"); c.width=320; c.height=198;
    const g=c.getContext("2d");
    g.fillStyle="#c3152c"; g.fillRect(0,0,320,198);
    let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
    for(let y=0;y<198;y++){ let x=0; while(x<320){ const len=3+rnd()*36, a=rnd()*0.11;
      g.fillStyle=rnd()<0.5?"rgba(255,255,255,"+a.toFixed(3)+")":"rgba(0,0,0,"+a.toFixed(3)+")"; g.fillRect(x|0,y,Math.ceil(len),1); x+=len; } }
    const gr=g.createLinearGradient(0,0,0,198);
    gr.addColorStop(0,"rgba(0,0,0,.35)"); gr.addColorStop(0.3,"rgba(255,255,255,.06)"); gr.addColorStop(1,"rgba(0,0,0,.22)");
    g.fillStyle=gr; g.fillRect(0,0,320,198);

  function rrPath(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function atext(str,x,y,size,color,align="center",weight="bold",italic=""){
    ctx.font=italic+" "+weight+" "+size+"px "+DIAL_FONT; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline="middle"; ctx.fillText(String(str),x,y);
  }
  const angAt=f=>AN_START-clamp(f,0,1)*AN_SWEEP;
  function face(cx,cy,r){
    ctx.beginPath(); ctx.arc(cx,cy,r+2,0,Math.PI*2); ctx.fillStyle="#141416"; ctx.fill();
    const g=ctx.createRadialGradient(cx-r*0.2,cy-r*0.25,r*0.1,cx,cy,r);
    g.addColorStop(0,"#fbfbfc"); g.addColorStop(0.75,"#eceef1"); g.addColorStop(1,"#cfd3d8");
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  }
  function ticks(cx,cy,r,max,step,midEvery,majEvery,fmt,labelR,labelSize){
    for(let v=0;v<=max+1e-6;v+=step){
      const a=angAt(v/max), maj=Math.abs(v/majEvery-Math.round(v/majEvery))<1e-6, mid=Math.abs(v/midEvery-Math.round(v/midEvery))<1e-6;

      line(cx+Math.cos(a)*(r-len),cy-Math.sin(a)*(r-len),cx+Math.cos(a)*(r-1),cy-Math.sin(a)*(r-1),"#141416",maj?1.6:mid?1.1:0.8);
      if(maj) atext(fmt(v),cx+Math.cos(a)*labelR,cy-Math.sin(a)*labelR,labelSize,"#141416");
    }
  }
  function needle(cx,cy,a,len,tail=6){
    const x2=cx+Math.cos(a)*len, y2=cy-Math.sin(a)*len, x0=cx-Math.cos(a)*tail, y0=cy+Math.sin(a)*tail;
    line(x0+0.6,y0+0.8,x2+0.6,y2+0.8,"rgba(0,0,0,.25)",2.2);
    line(x0,y0,x2,y2,"#e1222c",2.2);
    line(x0,y0,x2,y2,"#ff6a6a",0.6);
  }
  function hub(cx,cy,r){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle="#18181b"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx-1,cy-1,r*0.45,0,Math.PI*2); ctx.fillStyle="#3a3a40"; ctx.fill();
  }
  // mechanical drum counter: the last wheel rolls continuously, the others roll over only while the one to their right passes 9
  function drum(x,y,value,digits,lastWhite){
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,digits*6,9); ctx.clip();
    ctx.font="bold 7px Consolas, monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
    let carry=value%1;
    for(let i=digits-1;i>=0;i--){
      const p=Math.pow(10,digits-1-i), d=Math.floor(value/p)%10, white=lastWhite&&i===digits-1;
      rect(x+i*6,y,6,9,white?"#f1f1ee":"#101012");
      ctx.fillStyle=white?"#101012":"#f1f1ee";
      const off=Math.round(carry*9);
      ctx.fillText(String(d),x+i*6+3.5,y+5-off); ctx.fillText(String((d+1)%10),x+i*6+3.5,y+14-off);
      rect(x+i*6,y,1,9,"#2b2b30");
      carry=d===9?Math.max(0,(carry-0.85)/0.15):0;
    }
    ctx.restore();
    const sh=ctx.createLinearGradient(0,y,0,y+9); sh.addColorStop(0,"rgba(0,0,0,.55)"); sh.addColorStop(0.35,"rgba(0,0,0,0)"); sh.addColorStop(0.65,"rgba(0,0,0,0)"); sh.addColorStop(1,"rgba(0,0,0,.55)");
    ctx.fillStyle=sh; ctx.fillRect(x,y,digits*6,9);
    ctx.strokeStyle="#5a5a60"; ctx.lineWidth=1; ctx.strokeRect(x-0.5,y-0.5,digits*6+1,10);
  }
  function lcd(x,y,w,h,str,color="#ff8a4a"){
    rrPath(x,y,w,h,3); ctx.fillStyle="#0c0d0f"; ctx.fill(); ctx.strokeStyle="#4a1018"; ctx.lineWidth=1; ctx.stroke();
    ctx.font="bold 7px Consolas, monospace"; ctx.fillStyle=color; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(str,x+w/2,y+h/2+0.5);
  }
  function slot(x,y,label,on,color){
    // recessed window in the plate
    rrPath(x,y,18,9,3.5); ctx.fillStyle="#120406"; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.65)"; ctx.lineWidth=1; ctx.stroke();
    if(on){
      ctx.save();
      ctx.shadowColor=color; ctx.shadowBlur=7;
      const g=ctx.createLinearGradient(0,y,0,y+9); g.addColorStop(0,"#ffffff"); g.addColorStop(0.35,color); g.addColorStop(1,color);
      rrPath(x+1,y+1,16,7,3); ctx.fillStyle=g; ctx.globalAlpha=0.92; ctx.fill();
      ctx.restore();
      ctx.font="bold 6px Consolas, monospace"; ctx.fillStyle="rgba(20,4,6,.9)"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(label,x+9,y+5);
    } else {
      line(x+3,y+1.5,x+15,y+1.5,"rgba(255,255,255,.05)",1);
      ctx.font="bold 6px Consolas, monospace"; ctx.fillStyle="#3a1219"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(label,x+9,y+5);
    }
  }
  function gearWindow(ign){
    const gears=["P","R","N","D","S","L"], cell=9, stepped=ign&&(S.manual||S.gear==="S"||S.dstep);
    const w=gears.length*cell+cell+6, x0=160-w/2, y0=172, h=13;
    // recessed black window
    rrPath(x0,y0,w,h,4); ctx.fillStyle="#08080a"; ctx.fill();
    ctx.strokeStyle="#2a0a0f"; ctx.lineWidth=1.2; ctx.stroke();
    line(x0+4,y0+1.5,x0+w-4,y0+1.5,"rgba(0,0,0,.6)",1);
    line(x0+4,y0+h+0.5,x0+w-4,y0+h+0.5,"rgba(255,255,255,.12)",1);
    gears.forEach((g,i)=>{
      const cx=x0+3+cell/2+i*cell, cy=y0+h/2+0.5, on=ign&&S.gear===g;
      ctx.save();
      if(on){
        const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,7); glow.addColorStop(0,"rgba(255,214,150,.55)"); glow.addColorStop(1,"rgba(255,214,150,0)");
        ctx.fillStyle=glow; ctx.fillRect(cx-7,cy-7,14,14);
        ctx.shadowColor="rgba(255,190,110,.95)"; ctx.shadowBlur=5;
      }
      ctx.font="bold 8px Arial, Helvetica, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillStyle=on?"#fff6e2":ign?"#3d3f46":"#24252a"; ctx.fillText(g,cx,cy);
      ctx.restore();
    });
    // step number cell
    const sx=x0+3+cell/2+gears.length*cell+2, sy=y0+h/2+0.5;
    line(sx-cell/2-1,y0+3,sx-cell/2-1,y0+h-3,"#202126",1);
    ctx.save();
    if(stepped){ ctx.shadowColor="rgba(255,170,60,.95)"; ctx.shadowBlur=5; }
    ctx.font="bold 8px Arial, Helvetica, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle=stepped?"#ffc266":"#24252a"; ctx.fillText(stepped?String(S.vgear+1):"-",sx,sy);
    ctx.restore();
  }
  function drawAnalog(now){
    if(!plateTex) plateTex=makePlate();
    // bezel + hood
    ctx.fillStyle="#08090b"; ctx.fillRect(0,0,320,198);
    ctx.save(); rrPath(4,14,312,180,44); ctx.clip(); ctx.drawImage(plateTex,0,0);
    const hood=ctx.createLinearGradient(0,14,0,48); hood.addColorStop(0,"rgba(0,0,0,.55)"); hood.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=hood; ctx.fillRect(0,14,320,34); ctx.restore();
    rrPath(4.5,14.5,311,179,44); ctx.strokeStyle="#2a0a0f"; ctx.lineWidth=1.5; ctx.stroke();

    let sweep=null;
    if(S.sweepT<1.5){ const t=S.sweepT, e=u=>1-Math.pow(1-clamp(u,0,1),3); sweep=t<0.6?e(t/0.6):t<0.8?1:1-e((t-0.8)/0.7); }
    const blinkOn=(now%320)<160, ign=S.ignition, run=S.engine==="running";

    // ---- tachometer (0-8 x1000, red zone from 6.5)
    const tx=52, ty=110, tr=42;
    face(tx,ty,tr);
    ctx.save(); ctx.beginPath(); ctx.arc(tx,ty,tr-1,-angAt(S.P.limit/8000),-angAt(1),false); ctx.arc(tx,ty,tr-12,-angAt(1),-angAt(S.P.limit/8000),true); ctx.closePath(); ctx.clip();
    ctx.strokeStyle="#e1222c"; ctx.lineWidth=1.3; for(let i=-60;i<60;i+=3){ ctx.beginPath(); ctx.moveTo(tx+i,ty-40); ctx.lineTo(tx+i+40,ty+40); ctx.stroke(); }
    ctx.restore();
    ticks(tx,ty,tr,8,0.25,0.5,1,v=>v,tr-14,9);
    atext("x1000r/min",tx,ty-15,5.5,"#141416");
    const rpmF=sweep!=null?sweep:clamp(ui.dispRpm/8000,0,1);
    lcd(tx-14,ty+14,28,10,(S.map>=1?"+":"")+(sweep!=null?"0.00":(S.map-1).toFixed(2)),S.map>1.02?"#ffb72b":"#ff8a4a");
    needle(tx,ty,angAt(rpmF),tr-5);
    hub(tx,ty,5);

    // ---- speedometer (0-240 km/h) with drum odometer + trip
    const sx=160, sy=100, sr=66;
    face(sx,sy,sr);
    ticks(sx,sy,sr,240,5,10,20,v=>v,sr-15,8);
    atext("km/h",sx,sy-36,7,"#141416");
    drum(sx-18,sy-26,S.odometer%1000000,6,false);
    drum(sx-12,sy+14,(S.trip*10)%10000,4,true);
    atext("TINY TURBO",sx,sy+38,6.5,"#141416","center","bold","italic");
    const spF=sweep!=null?sweep:clamp(ui.dispSpeed/240,0,1);
    needle(sx,sy,angAt(spF),sr-6,8);
    hub(sx,sy,7);

    // ---- fuel + temperature twin dial
    const fx=268, fy=110, fr=42;
    face(fx,fy,fr);
    // two half-gauges facing each other: fuel pivot on the left, temp pivot on the right
    const fpX=fx-23, tpX=fx+23;
    const arcTicks=(px,a0,a1,n,redFrom)=>{ for(let i=0;i<=n;i++){
      const a=(a0+(a1-a0)*i/n)*Math.PI/180, big=i===0||i===n||i===n/2, r0=big?9.5:11.5;
      line(px+Math.cos(a)*r0,fy-Math.sin(a)*r0,px+Math.cos(a)*14.5,fy-Math.sin(a)*14.5,redFrom!=null&&i>=redFrom?"#e1222c":"#141416",big?1.6:1); } };
    arcTicks(fpX,-55,55,8,null);           // E (bottom) .. F (top), ticks on the right of the pivot
    arcTicks(tpX,235,125,8,7);             // C (bottom) .. H (top), ticks on the left, red end at H
    const lab=(px,deg,r,t)=>atext(t,px+Math.cos(deg*Math.PI/180)*r,fy-Math.sin(deg*Math.PI/180)*r,8,"#141416");
    lab(fpX,66,21,"F"); lab(fpX,-66,21,"E"); lab(tpX,114,21,"H"); lab(tpX,246,21,"C");
    atext("⛽",fpX-8,fy+10,6,S.fuel<15&&ign?"#e1222c":"#3a3a40");
    atext("♨",tpX+8,fy+10,6,S.coolant>108&&ign?"#e1222c":"#3a3a40");
    line(fx,fy-24,fx,fy+24,"rgba(20,20,22,.18)",1);
    const fuelF=sweep!=null?sweep:ui.fuelDisp/100, tempF=sweep!=null?sweep:clamp((ui.tempDisp-40)/90,0,1);
    needle(fpX,fy,(-55+110*fuelF)*Math.PI/180,13.5,3); hub(fpX,fy,3.5);
    needle(tpX,fy,(235-110*tempF)*Math.PI/180,13.5,3); hub(tpX,fy,3.5);

    // ---- warning lamps in the plate slots
    const sig=v=>v&&ui.blink, bulb=ign&&S.sweepT<2.2;
    slot(22,24,"◀",ign&&sig(ui.left),"#2bff6a");
    slot(44,24,"CHK",bulb||ign&&!run,"#ffb72b");
    slot(66,24,"OIL",bulb||ign&&S.oilPressure<0.3,"#ff3b3b");
    slot(33,38,"BAT",bulb||ign&&S.voltage<13,"#ff3b3b");
    slot(55,38,"BRK",bulb||ign&&S.handbrake,"#ff3b3b");
    slot(77,38,"CLD",bulb||ign&&S.coolant<50,"#4f8cff");
    slot(236,24,"TRB",bulb||ign&&run&&S.map>1.02,"#4fb3ff");
    slot(258,24,"REV",bulb||ign&&S.limiter&&blinkOn,"#ff3b3b");
    slot(280,24,"▶",ign&&sig(ui.right),"#2bff6a");
    slot(247,38,"ECO",bulb||ign&&run&&S.lph>0&&S.v>3&&(S.v*3.6)/S.lph>16,"#2bff6a");
    slot(269,38,"FUEL",bulb||ign&&ui.lowFuel,"#ffb72b");
    slot(100,173,"TC",ign&&run&&S.lock,"#2bff6a");
    slot(202,173,"STEP",ign&&run&&(S.dstep||S.manual||S.gear==="S"),"#ffb72b");

    // ---- backlit gear indicator under the speedo
    gearWindow(ign);

    // ---- small LCDs: clock + oil pressure
    const d=new Date();
    lcd(20,166,44,12,String(d.getHours()).padStart(2,"0")+(blinkOn?":":" ")+String(d.getMinutes()).padStart(2,"0"),"#ff8a4a");
    const tp=ui.tripPage===0?"OIL "+S.oilPressure.toFixed(1):tripPage().replace(" km/L","").replace(" km","");
    lcd(244,166,56,12,tp,ui.tripPage===0&&S.oilPressure<0.3&&ign?"#ff3b3b":"#ff8a4a");

    // lens glare
    ctx.save(); rrPath(4,14,312,180,44); ctx.clip();
    const gl=ctx.createLinearGradient(0,14,0,90); gl.addColorStop(0,"rgba(255,255,255,.07)"); gl.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=gl; ctx.beginPath(); ctx.moveTo(4,14); ctx.lineTo(316,14); ctx.lineTo(316,40); ctx.quadraticCurveTo(160,70,4,40); ctx.fill(); ctx.restore();

    if(!S.ignition){
      rect(0,0,320,198,"rgba(0,0,0,.62)");
      text("IGNITION OFF",160,96,14,C.white,"center","bold");
      text("PRESS I TO START",160,112,7,"#c9cdd3","center");
    }
    if(ui.paused) text("PAUSED",160,8,8,C.amber,"center","bold");
  }

  // trip computer: T key or a tap on the cluster cycles the page
  function outsideTemp(){ const h=((road.hour%24)+24)%24; return 27+4.5*Math.sin((h-9)/24*Math.PI*2)-4*road.rain-(road.biome==="forest"?3:0); }
  function tripPage(){
    const avg=S.tripFuel>0.02?S.trip/S.tripFuel:0, fuelL=S.fuel/100*S.P.tankL, kmh=Math.abs(S.v*3.6);
    switch(ui.tripPage){
      case 0: return "TRIP "+S.trip.toFixed(1)+" km";
      case 1: return "AVG "+(avg>0?Math.min(99.9,avg).toFixed(1):"--.-")+" km/L";
      case 2: return "RANGE "+Math.round(fuelL*(avg>3?Math.min(avg,25):14))+" km";
      case 3: return "INST "+(kmh<3||S.engine!=="running"?"--.-":S.lph<=0.001?"99.9":Math.min(99.9,kmh/S.lph).toFixed(1))+" km/L";
      default: return "OUT "+Math.round(outsideTemp())+"\u00b0C";
    }
  }
  canvas.addEventListener("pointerdown",()=>{ ui.tripPage=(ui.tripPage+1)%5; });
  function draw(now){
    if(ui.cluster==="analog"){ drawAnalog(now); return; }
    const bgG=ctx.createLinearGradient(0,0,0,198);
    bgG.addColorStop(0,"#080d15"); bgG.addColorStop(0.55,"#03060b"); bgG.addColorStop(1,"#070a11");
    ctx.fillStyle=bgG; ctx.fillRect(0,0,320,198);
    const vg=ctx.createRadialGradient(160,88,20,160,88,170);
    vg.addColorStop(0,"rgba(40,90,160,.12)"); vg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=vg; ctx.fillRect(0,0,320,198);
    rrPath(1.5,1.5,317,195,10); ctx.strokeStyle="#5b6676"; ctx.lineWidth=1; ctx.stroke();
    rrPath(4.5,4.5,311,189,8); ctx.strokeStyle="#162030"; ctx.stroke();
    drawTurn(25,14,true,ui.left&&ui.blink);
    drawTurn(295,14,false,ui.right&&ui.blink);
    drawVerticalGauge(12,43,"H","C",clamp((ui.tempDisp-50)/70,0,1)*8,8,S.coolant>108?C.red:C.blue,8);
    drawVerticalGauge(308,43,"F","E",ui.fuelDisp,100,ui.lowFuel?C.red:"#cbd2dc",8);
    text("♨",20,83,10,C.muted,"center");
    text("⛽",300,83,10,C.muted,"center");

    // ignition-on needle sweep (self test)
    let sweep=null;
    if(S.sweepT<1.5){
      const t=S.sweepT, e=u=>1-Math.pow(1-clamp(u,0,1),3);
      sweep=t<0.6?e(t/0.6):t<0.8?1:1-e((t-0.8)/0.7);
    }
    const blinkOn=(now%160)<80;
    drawSpeedometer(sweep!=null?sweep*SPEED_MAX:ui.dispSpeed);
    drawRpmGate(sweep!=null?sweep*7000:ui.dispRpm,blinkOn);
    drawBoost(S.map,sweep);

    // warning lamps (bulb check while ignition on / engine off)
    const ign=S.ignition, run=S.engine==="running";
    const bulb=ign&&S.sweepT<2.2;   // every lamp lights for a moment at key-on, like a real bulb check
    lamp(26,94,"CHECK",bulb||ign&&(!run||S.oilLevel<5),C.amber);
    lamp(58,94,"OIL",bulb||ign&&S.oilPressure<0.3,C.red);
    lamp(26,106,"BATT",bulb||ign&&S.voltage<13,C.red);
    lamp(58,106,"BRAKE",bulb||ign&&S.handbrake,C.red);
    lamp(26,118,"TURBO",bulb||ign&&run&&S.map>1.02,C.blue);
    lamp(58,118,"ECO",bulb||ign&&run&&S.lph>0&&S.v>3&&(S.v*3.6)/S.lph>16,C.green);
    lamp(26,130,"COLD",bulb||ign&&S.coolant<50,"#3f8cff");
    lamp(58,130,"FUEL",bulb||ign&&ui.lowFuel,C.amber);

    // transmission info
    const kmh=S.v*3.6;
    const ratio=S.gear==="R"?S.P.rRev:S.ratio;
    text("RATIO "+ratio.toFixed(2),202,104,7,C.white);
    const tcTxt=!run||!"DSLR".includes(S.gear)?"TC  --":S.lock?"TC  LOCK":"TC  SLIP";
    text(tcTxt,202,114,7,S.lock?C.green:C.muted);
    let mode="";
    if(S.gear==="P"||S.gear==="N") mode=S.gear==="P"?"PARK":"NEUTRAL";
    else if(S.gear==="R") mode="REVERSE";
    else if(S.manual) mode="MANUAL "+(S.vgear+1);
    else if(S.gear==="S") mode="SPORT  "+(S.vgear+1);
    else if(S.gear==="L") mode="LOW RANGE";
    else mode=S.dstep?"D-STEP "+(S.vgear+1):"CVT AUTO";
    text(mode,202,124,7,C.white);
    if(S.msgT>0) text(S.msg,202,135,7,C.amber,"left","bold");
    else if(S.manual && S.rpm>6000 && S.vgear<6 && blinkOn) text("▲ SHIFT UP",202,135,7,C.green,"left","bold");
    else if(S.limiter) text("REV LIMIT",202,135,7,C.red,"left","bold");

    // lower info rows
    fadeLine(150,"#2d3746");
    text("OIL P",12,162,8,C.white);
    text(S.oilPressure.toFixed(1)+" bar",79,162,9,C.white);
    text("C.TEMP",205,162,8,C.white);
    text(Math.round(S.coolant)+"°C",305,162,9,C.white,"right");
    text("OIL T",12,179,8,C.white);
    text(Math.round(S.oilTemp)+"°C",61,179,9,C.white);
    text("LEVEL",112,179,7,C.muted);
    text(Math.round(S.oilLevel)+"%",158,179,9,S.oilLevel<20?C.red:C.white);
    text("▣ VOLT",205,179,8,C.white);
    text(S.voltage.toFixed(1)+"V",305,179,9,S.voltage<11.5?C.amber:C.white,"right");

    // gear box
    rect(140,138,40,29,"#03060b");
    rrPath(142.5,140.5,35,24,4);
    const gbg=ctx.createLinearGradient(0,140,0,165); gbg.addColorStop(0,"#0f1724"); gbg.addColorStop(1,"#060a10");
    ctx.fillStyle=gbg; ctx.fill();
    glow(S.shiftFlash>0?"rgba(255,255,255,.9)":"rgba(46,163,255,.55)",S.shiftFlash>0?8:4,()=>{ rrPath(142.5,140.5,35,24,4); ctx.strokeStyle=S.shiftFlash>0?C.white:"#3d6a99"; ctx.lineWidth=1; ctx.stroke(); });
    let gl=S.gear;
    if(S.manual) gl="M"+(S.vgear+1); else if(S.gear==="S") gl="S"+(S.vgear+1);
    glow("rgba(170,215,255,.8)",6,()=>text(gl,160,152,gl.length>1?16:18,C.white,"center","bold"));
    text("CVT",160,171,10,C.white,"center","bold");

    fadeLine(185,"#4b5565");
    const d=new Date();
    text(String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),12,191,10,C.white);
    text(tripPage(),160,191,7,C.muted,"center");
    text(String(Math.floor(S.odometer)).padStart(6,"0")+" km",265,191,10,C.white,"right");

    const sheen=ctx.createLinearGradient(0,0,320,198);
    sheen.addColorStop(0,"rgba(255,255,255,.05)"); sheen.addColorStop(0.35,"rgba(255,255,255,0)");
    ctx.fillStyle=sheen; ctx.fillRect(0,0,320,198);
    if(!S.ignition){
      rect(0,0,320,198,"rgba(0,0,0,.66)");
      text("IGNITION OFF",160,96,14,C.white,"center","bold");
      text("PRESS I TO START",160,112,7,C.muted,"center");
    }
    if(ui.paused) text("PAUSED",160,26,8,C.amber,"center","bold");
    void kmh;
  }

      pc:[
        ["ยินดีต้อนรับ! ตอนนี้รถจอดอยู่เกียร์ ",K("P")," และเครื่องยังดับอยู่"],
        ["กด ",K("I")," เพื่อสตาร์ทเครื่อง แล้วรอให้รอบเดินเบานิ่งก่อน"],
        ["จะออกจากเกียร์ P ต้องกด ",K("↓")," เบรกค้างไว้ แล้วกด ",K("D")," เหมือนรถจริง ไม่เหยียบเบรกจะเข้าเกียร์ไม่ได้"],
        ["กด ",K("↑")," ค้างไว้เพื่อเร่ง หรือ ",K("Shift"),"+",K("↑")," เพื่อเร่งเบาๆ"],
        [K("←"),K("→")," ไฟเลี้ยวและเปลี่ยนเลน ",K("S")," โหมดสปอร์ต ",K("+"),K("−")," เปลี่ยนสเต็ปเอง"],
        ["รถคันหน้าจะเห็นแค่ไฟท้าย หลบด้วย ",K("←"),K("→")," ถ้าชนเมื่อไหร่ รอบนั้นจบทันที"]
      ],
      touch:[
        ["ยินดีต้อนรับ! ตอนนี้รถจอดอยู่เกียร์ ",K("P")," และเครื่องยังดับอยู่"],
        ["แตะ ",K("START")," เพื่อสตาร์ทเครื่อง แล้วรอให้รอบเดินเบานิ่งก่อน"],
        ["จะออกจากเกียร์ P ต้องกด ",K("B")," เบรกค้างไว้ แล้วแตะ ",K("D")," เหมือนรถจริง ไม่เหยียบเบรกจะเข้าเกียร์ไม่ได้"],
        ["กด ",K("A")," ค้างไว้เพื่อเร่ง ปล่อยให้รถไหลไปเอง กด ",K("B")," ค้างไว้เพื่อหยุด"],
        [K("◀"),K("▶")," ไฟเลี้ยวและเปลี่ยนเลน ",K("▲"),K("▼")," เปลี่ยนสเต็ปเองในเกียร์ D หรือ S"],
        ["รถคันหน้าจะเห็นแค่ไฟท้าย หลบด้วย ",K("◀"),K("▶")," ถ้าชนเมื่อไหร่ รอบนั้นจบทันที"]
      ]
    }
  };
  const TIPS={
    en:{
      "PRESS BRAKE":{pc:["Hold ",K("↓")," brake first, then tap the gear key."],touch:["Hold ",K("B")," brake first, then tap the gear."]},
      "SHIFT TO P/N":{pc:["The engine only starts in ",K("P")," or ",K("N"),"."],touch:["The engine only starts in ",K("P")," or ",K("N"),"."]},
      "SHIFT INHIBIT":{pc:["Slow down first. P and R only work below 6 km/h."],touch:["Slow down first. P and R only work below 6 km/h."]}
    },
    th:{
      "PRESS BRAKE":{pc:["กด ",K("↓")," เบรกค้างไว้ก่อน แล้วค่อยกดปุ่มเกียร์"],touch:["กด ",K("B")," เบรกค้างไว้ก่อน แล้วค่อยแตะเกียร์"]},
      "SHIFT TO P/N":{pc:["สตาร์ทเครื่องได้เฉพาะเกียร์ ",K("P")," หรือ ",K("N")],touch:["สตาร์ทเครื่องได้เฉพาะเกียร์ ",K("P")," หรือ ",K("N")]},
      "SHIFT INHIBIT":{pc:["ชะลอก่อนน้า เกียร์ P กับ R เข้าได้ตอนต่ำกว่า 6 km/h"],touch:["ชะลอก่อนน้า เกียร์ P กับ R เข้าได้ตอนต่ำกว่า 6 km/h"]}
    }
  };
  const TITLES={ en:{help:"HOW TO DRIVE",tip:"TIP"}, th:{help:"วิธีขับ",tip:"เคล็ดลับ"} };
  const dl={ open:false, modal:false, pages:[], page:0, shown:0, len:0, closeT:0, title:"" };
  const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const tokLen=p=>p.reduce((n,t)=>n+(typeof t==="string"?t.length:1),0);
  function renderDialog(){
    let left=Math.floor(dl.shown), html="";
    for(const t of dl.pages[dl.page]){
      if(left<=0) break;
      if(typeof t==="string"){ html+=esc(t.slice(0,left)); left-=t.length; }
      else { html+='<span class="k">'+esc(t.k)+"</span>"; left--; }
    }
    dlgText.innerHTML=html;
    const done=dl.shown>=dl.len;
    dlgMore.textContent=!done?"":dl.page<dl.pages.length-1?"▼":dl.modal?"OK":"";
    dlgTitle.textContent=dl.title+(dl.pages.length>1?"  "+(dl.page+1)+"/"+dl.pages.length:"");
  }
  function openDialog(pages,{title,modal}){
    dl.pages=pages; dl.page=0; dl.shown=0; dl.len=tokLen(pages[0]); dl.open=true; dl.modal=modal; dl.title=title;
    dl.closeT=modal?0:4.5; dlg.classList.add("show"); dlg.classList.toggle("tip",!modal); renderDialog();
  }
  function closeDialog(){
    dl.open=false; dlg.classList.remove("show");
    if(dl.modal){ try{ localStorage.setItem("mdc-help-seen","1"); }catch(e){} }
  }
  function advanceDialog(){
    if(!dl.open) return;
    if(dl.shown<dl.len){ dl.shown=dl.len; renderDialog(); return; }
    if(dl.page<dl.pages.length-1){ dl.page++; dl.shown=0; dl.len=tokLen(dl.pages[dl.page]); renderDialog(); return; }
    closeDialog();
  }
  const mode=()=>ui.pad?"touch":"pc";
  function showHelp(){ openDialog(PAGES[ui.lang][mode()],{title:TITLES[ui.lang].help,modal:true}); }
  function updateDialog(dt){
    if(!dl.open) return;
    if(dl.shown<dl.len){ dl.shown=Math.min(dl.len,dl.shown+dt*45); renderDialog(); }
    if(!dl.modal){ dl.closeT-=dt; if(dl.closeT<=0) closeDialog(); }
  }
  dlg.addEventListener("pointerdown",e=>{ e.preventDefault(); advanceDialog(); });
  window.addEventListener("keydown",e=>{
    if(!dl.open||!dl.modal) return;
    if(e.key==="Enter"||e.key===" "||e.key==="Escape"){ e.preventDefault(); e.stopImmediatePropagation(); if(!e.repeat) e.key==="Escape"?closeDialog():advanceDialog(); }
  },{capture:true});
  { const prev=onSimEvent; onSimEvent=ev=>{ prev(ev);
      if(ev.type==="msg" && TIPS[ui.lang][ev.msg] && !(dl.open&&dl.modal)) openDialog([TIPS[ui.lang][ev.msg][mode()]],{title:TITLES[ui.lang].tip,modal:false}); }; }
  const langBtn=$("btnLang");
  function setLang(l,announce){
    ui.lang=l; try{ localStorage.setItem("mdc-lang",l); }catch(e){}
    langBtn.innerHTML=l==="th"?'<b>TH</b>/EN':'TH/<b>EN</b>';
    document.documentElement.lang=l;
    applyUiLang();
    if(dl.open){ const wasModal=dl.modal; closeDialog(); if(wasModal) showHelp(); }
    if(announce){ react("joy",1,null,2); mo.txt=l==="th"?"ภาษาไทยจ้า~":"English now!"; mo.shown=0; mo.talkT=0.8; mo.bubbleT=1.6; bubble.classList.add("show"); }
  }
  langBtn.addEventListener("click",()=>setLang(ui.lang==="th"?"en":"th",true));
  setLang(ui.lang,false);

  /* ============================== TOUCH PAD ==============================
     Floating handheld-style controller for phones/tablets. Buttons fire the
     same key events as the keyboard, so every control goes through one path.
     ===================================================================== */
  const pad=$("pad");
  const isTouch=matchMedia("(hover: none) and (pointer: coarse)").matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const vkey=(key,type)=>window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true,cancelable:true}));
  const PAD_KEYS={ up:"+", down:"-", left:"ArrowLeft", right:"ArrowRight", a:"ArrowUp", b:"ArrowDown", start:"i", select:"Escape" };
  const HOLD=new Set(["a","b"]);
  function setPad(on){
    ui.pad=on; document.body.classList.toggle("has-pad",on); padBtn.classList.toggle("on",on);
    if(on){ hintEl.classList.add("hidden"); $("btnKeys").classList.remove("on"); }
  }
  pad.querySelectorAll("[data-k]").forEach(el=>{
    const id=el.dataset.k;
    const press=e=>{
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      if(!audio.userOff && (!audio.ctx || audio.ctx.state!=="running")) startAudio();
      if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8);
      el.classList.add("down");
      if(dl.open && dl.modal){ advanceDialog(); el._skip=true; return; }
      el._skip=false;
      if(id.startsWith("g:")){ vkey(id.slice(2).toLowerCase(),"keydown"); vkey(id.slice(2).toLowerCase(),"keyup"); return; }
      if(id==="hb"){ S.handbrake=!S.handbrake; return; }
      const key=PAD_KEYS[id];
      vkey(key,"keydown");
      if(!HOLD.has(id)) vkey(key,"keyup");
    };
    const release=()=>{
      el.classList.remove("down");
      if(!el._skip && HOLD.has(id)) vkey(PAD_KEYS[id],"keyup");
      el._skip=false;
    };
    el.addEventListener("pointerdown",press);
    el.addEventListener("pointerup",release);
    el.addEventListener("pointercancel",release);
    el.addEventListener("lostpointercapture",()=>{ if(el.classList.contains("down")) release(); });
  });
  pad.addEventListener("contextmenu",e=>e.preventDefault());
  const padGears=[...pad.querySelectorAll("[data-k^='g:']")], hbBtn=pad.querySelector("[data-k='hb']");
  function syncPad(){
    if(!ui.pad) return;
    for(const g of padGears) g.classList.toggle("on",g.dataset.k.slice(2)===S.gear);
    hbBtn.classList.toggle("on",S.handbrake);
  }
  const padBtn=$("btnPad");
  padBtn.addEventListener("click",()=>setPad(!ui.pad));
  $("btnHelp").addEventListener("click",showHelp);
  setPad(isTouch);
  let seen=false; try{ seen=localStorage.getItem("mdc-help-seen")==="1"; }catch(e){}
  if(!seen) setTimeout(showHelp,400);

  /* ============================== INPUT ============================== */
  const keys=new Set();
  const gearKeys={p:"P",r:"R",n:"N",d:"D",s:"S",l:"L"};
  window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
    if(["arrowup","arrowdown"," "].includes(k)) keys.add(k);
    if(k==="shift") keys.add("shift");
    if(e.repeat) return;
    if(k==="arrowleft"){ ui.left=!ui.left; if(ui.left) ui.right=false; }
    if(k==="arrowright"){ ui.right=!ui.right; if(ui.right) ui.left=false; }
    if(gearKeys[k]) sim.selectGear(gearKeys[k]);
    if(k==="+"||k==="="||e.code==="NumpadAdd") sim.manualShift(1);
    if(k==="-"||k==="_"||e.code==="NumpadSubtract") sim.manualShift(-1);
    if(k==="i") sim.ignitionPress();
    if(k==="escape") ui.paused=!ui.paused;
    if(k==="t") ui.tripPage=(ui.tripPage+1)%5;
    if(k===" ") S.handbrake=true;
  },{passive:false});
  window.addEventListener("keyup",e=>{
    const k=e.key.toLowerCase(); keys.delete(k);
    if(k===" ") S.handbrake=false;
  });
  window.addEventListener("blur",()=>{ keys.clear(); S.pedal=0; S.brake=0; S.handbrake=false; });

  /* ============================== LOOP ============================== */
  function frame(now){
    const dt=Math.min((now-ui.last)/1000,0.05); ui.last=now;
    if(ui.failed) ui.failT+=dt;
    if(!ui.paused && !ui.failed){
      const target=keys.has("arrowup")&&S.ignition?(keys.has("shift")?0.45:1):0;
      S.pedal=target>S.pedal?Math.min(target,S.pedal+dt*2.4):Math.max(target,S.pedal-dt*4.5);
      S.brake=keys.has("arrowdown")?Math.min(1,S.brake+dt*2.5):Math.max(0,S.brake-dt*4);
      ui.blinkClock+=dt;
      if(ui.blinkClock>=0.4){
        ui.blinkClock=0; ui.blink=!ui.blink;
        if((ui.left||ui.right)&&S.ignition) audio.event({type:"tick",amt:ui.blink?0.5:0.32,on:ui.blink});
      }
      const n=Math.max(1,Math.ceil(dt/0.004));
      for(let i=0;i<n;i++) sim.step(dt/n);
      S.sweepT+=dt;
      // needles: damped springs with a touch of overshoot; the speedo over-reads ~2% like a real one
      const spT=Math.abs(S.v*3.6)*1.02, rT=S.rpm, sub=4, h4=dt/sub;
      for(let i=0;i<sub;i++){
        ui.spV+=((spT-ui.dispSpeed)*130-2*0.7*11.4*ui.spV)*h4; ui.dispSpeed+=ui.spV*h4;
        ui.rpmV+=((rT-ui.dispRpm)*480-2*0.68*21.9*ui.rpmV)*h4; ui.dispRpm+=ui.rpmV*h4;
      }
      ui.dispSpeed=Math.max(0,ui.dispSpeed); ui.dispRpm=Math.max(0,ui.dispRpm);
      ui.spdNumT-=dt; if(ui.spdNumT<=0){ ui.spdNumT=0.25; ui.spdNum=Math.round(spT); }
      // fuel gauge is damped against slosh (fills quicker when refuelling); temp gauge is buffered around normal
      ui.fuelDisp+=(S.fuel-ui.fuelDisp)*clamp(dt*(S.fuel>ui.fuelDisp+2?0.5:0.12),0,1);
      if(ui.fuelDisp<12) ui.lowFuel=true; else if(ui.fuelDisp>15) ui.lowFuel=false;
      const ct=S.coolant, buf=ct<70?ct:ct<76?70+(ct-70)*3.3:ct<106?90:90+(ct-106)*2;
      ui.tempDisp+=(buf-ui.tempDisp)*clamp(dt*0.8,0,1);
      ui.rpmNumT-=dt;
      if(ui.rpmNumT<=0){ ui.rpmNumT=0.1; ui.rpmNum=Math.round(S.rpm/10)*10; }
      updateRoad(dt);
      // overrun crackle from the sport exhaust
      if(S.engine==="running" && S.rpm>2200 && S.pedal<0.05 && (S.decelCut||S.limiter)){
        const sport=S.gear==="S"||S.manual;
        const rate=S.limiter?2.5:S.popWin*(sport?4:1.6)+(S.rpm>3800&&sport?0.35:0);
        if(Math.random()<rate*dt){ audio.event({type:"pop",amt:Math.random()}); onSimEvent({type:"pop"}); }
      }
      const kmhNow=Math.abs(S.v*3.6);
      if(S.brake>0.15 && ui.prevKmh>0.8 && kmhNow<0.05){ audio.event({type:"settle"}); onSimEvent({type:"settle"}); }
      ui.prevKmh=kmhNow;
    }
    if(S.handbrake!==ui.prevHB){ if(ui.prevHB!==undefined) audio.event({type:"hb",on:S.handbrake}); ui.prevHB=S.handbrake; }
    if(audio.on){
      const run=S.engine==="running";
      audio.send({
        rpm:S.rpm, load:clamp(S.comb/S.P.maxTq+(S.blipT>0?0.45:0),0,1.2), thr:S.thr,
        turbo:S.turbo, boost:Math.max(0,S.map-1), starter:S.engine==="cranking"?1:0,
        speed:Math.abs(S.v*3.6), cut:S.cut?1:0, running:run?1:0,
        pop:0, vol:(ui.paused||(ui.failed&&ui.failT>0.7))?0:ui.volume,
        ign:S.ignition?1:0, brake:S.brake, cold:clamp((50-S.coolant)/30,0,1),
        crankP:S.engine==="cranking"?clamp(S.crankT/0.65,0,1):0, rev:S.gear==="R"&&S.ignition?1:0,
        wg:run&&S.thr>0.55?clamp((S.map-1-0.78*(S.gear==="S"||S.manual?1:0.9))/0.15,0,1):0,
        rain:road.rain*(1-road.tunnel), tunnel:road.tunnel
      });
    }
    draw(now);
    drawRoad(now);
    updateMochi(dt);
    drawMochi();
    syncMenu();
    syncPad();
    updateDialog(dt);
    requestAnimationFrame(frame);
  }
  draw(performance.now());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
